<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso PRL · Personal de limpieza</title>
<meta name="description" content="Formación PRL (art. 19 Ley 31/1995) para el puesto de personal de limpieza: riesgos del puesto, medidas preventivas, emergencias y vigilancia de la salud.">
<style>
html{--bg:#eef5f9;--card:#fff;--txt:#1d2b36;--mut:#4a5a68;--pri:#0277ab;--pri2:#009CD7;--acc:#128a3c;--acc2:#16B14C;--bd:#d6e4ec;--ok:#15803d;--ko:#c62828;--amb:#a15c00;--navy:#06476b;--navy2:#0277ab;--btnTxt:#fff;--tagTxt:#035f8c}
html[data-theme=dark]{--bg:#06131c;--card:#0d2130;--txt:#e8f0f6;--mut:#a9bccb;--pri:#4cc0f0;--pri2:#38b6ec;--acc:#3ddc84;--acc2:#3ddc84;--bd:#24445a;--ok:#22c55e;--ko:#ff6b6b;--amb:#fbbf24;--navy:#041e2e;--navy2:#06476b;--btnTxt:#04121d;--tagTxt:#9fdcf7}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden;
background-image:radial-gradient(1100px 600px at 100% -10%,color-mix(in srgb,var(--pri2) 12%,transparent),transparent 60%),linear-gradient(color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--pri) 5%,transparent) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px;background-attachment:fixed}
a{color:var(--pri)}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;border-bottom:3px solid var(--acc2);box-shadow:0 4px 18px #0003}
header h1{font-size:1rem;margin:0;flex:1;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden}
header h1 span{overflow:hidden;text-overflow:ellipsis}
header button{background:#ffffff1a;border:1px solid #ffffff40;color:#fff}
.logo-h{height:34px;background:#fff;border-radius:8px;padding:3px 8px;display:block;flex:none}
.prog{flex:2;max-width:320px;height:8px;background:#ffffff30;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#009CD7,#16B14C);transition:width .5s}
#pct{font-size:.85rem}
.af input[readonly]{background:color-mix(in srgb,var(--bg) 80%,var(--card));cursor:default;color:var(--txt)}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--txt);border-radius:9999px;padding:7px 14px;transition:transform .15s,background .2s}button:hover{transform:translateY(-1px)}
.btn{background:var(--pri);color:var(--btnTxt);border:none;font-weight:700;box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 30%,transparent)}
.wrap{display:flex;max-width:1240px;margin:auto}
nav{width:290px;flex:none;padding:16px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;background:color-mix(in srgb,var(--card) 70%,transparent)}
nav a{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;color:var(--txt);text-decoration:none;margin-bottom:2px;cursor:pointer;font-size:.88rem}
nav a:hover{background:color-mix(in srgb,var(--pri) 10%,transparent)}
nav a.on{background:linear-gradient(90deg,var(--pri),var(--pri2));color:var(--btnTxt)}nav a .ck{margin-left:auto}
nav details.ng{background:none;border:none;margin:6px 0}nav details.ng summary{padding:8px 10px;font-size:.92rem}nav details.ng summary small{color:var(--mut);font-weight:400}
main{flex:1;padding:22px;min-width:0}
.view{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2,h3,h4{letter-spacing:-.01em;line-height:1.25}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 1px 2px #0000000d,0 8px 24px #0a1f330d}
.lc{cursor:pointer;transition:transform .2s,box-shadow .2s}.lc:hover{transform:translateY(-4px);box-shadow:0 10px 24px #00000022}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--pri2) 14%,var(--card));color:var(--tagTxt);border:1px solid color-mix(in srgb,var(--pri2) 35%,transparent)}
.tag.t2{background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
details.bl{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
details.bl summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none}details.bl summary::-webkit-details-marker{display:none}
details.bl summary::after{content:"＋";float:right;color:var(--pri)}details.bl[open] summary::after{content:"－"}
details.bl>div{padding:0 16px 14px}
.key{border-left:5px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card))}
.note{border-left:5px solid var(--pri2);background:color-mix(in srgb,var(--pri2) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.alert{border-left:5px solid var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
.caso{border:2px dashed color-mix(in srgb,var(--pri) 55%,transparent);background:color-mix(in srgb,var(--pri) 6%,var(--card));padding:12px 14px;border-radius:12px;margin:12px 0}
.caso>b:first-child{color:var(--pri)}
.tbl{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;min-width:480px;font-size:.92rem}th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}th{background:color-mix(in srgb,var(--pri) 15%,var(--card))}
.sem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.sem>div{border-radius:12px;padding:12px;border:2px solid}
.sv{border-color:#16B14C!important;background:color-mix(in srgb,#16B14C 10%,var(--card))}.sa{border-color:#f59e0b!important;background:color-mix(in srgb,#f59e0b 12%,var(--card))}.sr{border-color:#e53935!important;background:color-mix(in srgb,#e53935 10%,var(--card))}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.flow span{background:color-mix(in srgb,var(--pri) 12%,var(--card));border:1px solid color-mix(in srgb,var(--pri) 40%,transparent);border-radius:10px;padding:6px 10px;font-size:.88rem}.flow i{font-style:normal;color:var(--pri);font-weight:800}
.q{margin:16px 0}.q p{font-weight:700;margin:.2em 0 .5em}.opt{display:block;width:100%;text-align:left;margin:6px 0;border-radius:12px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}.opt:disabled{cursor:default;transform:none;opacity:1}
html[data-theme=dark] .opt.ok,html[data-theme=dark] .opt.ko{color:#04121d}
.fb{font-size:.9rem;min-height:1.2em;font-weight:600}.score{font-size:1.15rem;font-weight:800}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
figure{margin:12px 0;text-align:center}figure img{max-width:100%;border-radius:12px;border:1px solid var(--bd);cursor:zoom-in;background:#fff}figcaption{font-size:.8rem;color:var(--mut)}
.lb{position:fixed;inset:0;background:#000e;z-index:1000;overflow:auto;touch-action:pinch-zoom pan-x pan-y;animation:fade .2s}.lbw{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 10px 16px;box-sizing:border-box}.lb img{max-width:min(96vw,2000px);max-height:84vh;width:auto;height:auto;border-radius:8px;background:#fff;cursor:zoom-in;border:0}.lb.z .lbw{align-items:flex-start;justify-content:flex-start}.lb.z img{max-width:none;max-height:none;width:auto;cursor:zoom-out}.lbh{color:#dfe9f0;font-size:.82rem;margin:10px 0 0;text-align:center}.lbx{position:fixed;top:10px;right:10px;z-index:2;width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:#0b3a55;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}.lbx:focus-visible,figure img:focus-visible{outline:3px solid #16B14C;outline-offset:3px}html.lbo{overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mut);font-size:.88rem;margin:4px 0 8px}
.hx{position:relative;overflow:hidden;border-radius:22px;color:#fff;padding:40px 34px;background:linear-gradient(135deg,var(--navy) 0%,#035f8c 55%,#0291CE 100%);box-shadow:0 20px 50px #0a1f3355;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center}
.hx::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,#009CD7 0 50%,#16B14C 50% 100%)}
.hx>*{position:relative;min-width:0}
.logo-x{height:54px;background:#fff;border-radius:12px;padding:6px 12px;margin-bottom:14px;box-shadow:0 6px 18px #0003;max-width:100%}
.eyb{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9ff0bb}
.eyb::before{content:"";width:26px;height:2px;background:#16B14C}
.hx h2{font-size:clamp(1.7rem,4.4vw,3.1rem);line-height:1.07;margin:.35em 0 .3em;font-weight:800}
.hx h2 em{font-style:normal;color:#9ff0bb}
.hx p.sub{font-size:1.04rem;color:#e1eef7;max-width:580px;margin:0 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go{background:#0f7a35;color:#fff;border:none;font-weight:800;padding:13px 26px;font-size:1.02rem;box-shadow:0 8px 24px #16b14c55}
.go2{background:transparent;color:#fff;border:1px solid #ffffff66;padding:12px 18px}
.pbar{margin-top:18px;max-width:420px}.pbar small{color:#d3e4f0}.pbar div{height:8px;border-radius:9px;background:#ffffff26;overflow:hidden;margin-top:4px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}




@keyframes blink{50%{opacity:.2}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;border-top:3px solid var(--acc2)}
.stat b{display:block;font-size:1.6rem;line-height:1.1;color:var(--pri)}.stat span{font-size:.85rem;color:var(--mut)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 10px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;position:relative;overflow:hidden}
.mc .n{font-size:2.6rem;font-weight:800;color:color-mix(in srgb,var(--pri2) 25%,transparent);position:absolute;right:14px;top:4px}
.mc h3{margin:.4em 0 .2em;font-size:1.02rem}.mc p{margin:0;color:var(--mut);font-size:.88rem}
.mp{height:6px;background:var(--bd);border-radius:9px;margin-top:12px;overflow:hidden}.mp i{display:block;height:100%;background:linear-gradient(90deg,#009CD7,#16B14C)}
.sech{display:flex;align-items:center;gap:10px;margin:26px 0 4px;font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.sech::after{content:"";flex:1;height:1px;background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.grid .card{margin:0}.grid h4{margin:.4em 0}
.hero{background:linear-gradient(135deg,var(--navy),#035f8c 60%,#0291CE);color:#fff;border-radius:18px;padding:26px}
.hero h2{margin:.2em 0}
.ofc{width:100%;max-width:460px;justify-self:center}.himg{height:auto;border-radius:16px;background:#fff;cursor:zoom-in;box-shadow:0 8px 24px #0003}
.ofc .cur{animation:blink 1.1s steps(1) infinite}}
.ofc .arm{animation:type .5s ease-in-out infinite alternate;transform-origin:246px 136px}
@keyframes type{from{transform:rotate(0)}to{transform:rotate(-1.5deg)}}}}
.ofc .plant{animation:sw 4s ease-in-out infinite;transform-origin:35px 174px}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
}
.vb{display:inline-block;font-size:.78rem;font-weight:800;border-radius:99px;padding:1px 10px;border:1px solid;white-space:nowrap}
.v-trivial{background:#e6f4ea;color:#14532d;border-color:#15803d}.v-tolerable{background:#e0f2fe;color:#0c4a6e;border-color:#0369a1}.v-moderado{background:#fef3c7;color:#713f12;border-color:#a16207}.v-importante{background:#ffedd5;color:#7c2d12;border-color:#c2410c}.v-intolerable{background:#fee2e2;color:#7f1d1d;border-color:#b91c1c}
.rk{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--bd);border-left:5px solid var(--pri);border-radius:12px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--pri) 5%,var(--card))}.rk small{color:var(--mut)}
.rc{font-weight:800;font-size:.8rem;background:var(--pri);color:var(--btnTxt);border-radius:8px;padding:1px 8px}
.ley{border-left:5px solid #7c3aed;background:color-mix(in srgb,#7c3aed 9%,var(--card));padding:12px 14px;border-radius:10px;margin:10px 0}
html[data-theme=dark] .ley{border-color:#c4b5fd}


button:disabled{opacity:.55;cursor:not-allowed}
.ub{max-width:200px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}.ub span{overflow:hidden;text-overflow:ellipsis}
body.noauth nav,body.noauth .prog,body.noauth #pct{display:none}
.auth{max-width:760px;margin:auto}.ah{grid-template-columns:1.3fr 1fr}.ah .ofc{max-width:260px}
.tabs{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.af label{display:block;font-weight:700;margin:10px 0;font-size:.92rem}.af input:not([type=checkbox]),.af select{display:block;width:100%;font:inherit;font-weight:400;padding:10px 12px;margin-top:4px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--txt)}
.af input:focus,.af select:focus{outline:3px solid color-mix(in srgb,var(--pri) 45%,transparent)}
.af .chk{display:flex;gap:8px;align-items:flex-start;font-weight:600}.af .chk input{width:20px;height:20px;flex:none;margin-top:2px}
.rgpd{font-size:.82rem}.err{color:var(--ko);font-weight:700;min-height:1.2em}
.sw{text-align:left}
[hidden]{display:none!important}nav a.lk{opacity:.6}nav a.lk .ck{opacity:1}.lockv h2{margin-top:0}#menu{display:none}
ul,ol{padding-left:1.3em}li{margin:3px 0}
@media(max-width:1000px){.mods{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.hx{grid-template-columns:1fr;padding:28px 20px 32px}.ofc{max-width:260px;order:-1}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){nav{position:fixed;left:0;top:59px;background:var(--card);z-index:9;transform:translateX(-105%);transition:transform .3s;border-right:1px solid var(--bd);width:min(290px,86vw)}nav.open{transform:none}#menu{display:inline-block}.prog{display:none}}
@media(max-width:600px){main{padding:14px 12px}.mods{grid-template-columns:1fr}.sem{grid-template-columns:1fr}.logo-h{height:28px}.logo-x{height:44px}header{gap:8px;padding:10px}header h1{font-size:.88rem}.card{padding:14px}details.bl>div{padding:0 12px 12px}}
@media(max-width:420px){#pct{display:none}.ub{max-width:110px;padding:6px 10px}.ah{padding:22px 16px}header h1 span{max-width:40vw}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.pn,.noprint,.alert{display:none!important}main{padding:0}body{background:#fff;color:#000}.wrap{display:block}details.bl{break-inside:avoid}}
.fig{margin:.3rem 0 .9rem}.fig svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto;border-radius:14px;border:1px solid var(--bd)}.fig img{cursor:zoom-in;display:block;width:100%;height:auto;max-width:720px;margin:0 auto;border-radius:14px;border:1px solid var(--bd);background:#fff}.fig figcaption{font-size:.86rem;color:var(--mut);text-align:center;margin-top:.35rem}
.sigf .chk input[type=radio]{width:20px;height:20px;flex:none;margin:2px 0 0;padding:0;display:inline-block}.sigf p{font-size:.95rem}.sigf h3{margin-top:1.2em}.sigf h3:first-child{margin-top:0}.sgg{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin:10px 0}.sgg label{display:flex;flex-direction:column;gap:4px;font-weight:600}.sgr{display:grid;gap:8px;margin:10px 0}.sgr .chk{border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.sigbox{position:relative;border:2px dashed var(--pri);border-radius:12px;background:#fff;height:190px;max-width:620px}.sigbox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;border-radius:12px}.sigph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa9b5;font-size:1.3rem;pointer-events:none;font-style:italic}@media(max-width:600px){.sgg{grid-template-columns:1fr}}
</style>
</head>

const M1={t:"Tu puesto: normativa, evaluación de riesgos y tareas",fmin:3,s:"La normativa que te protege, cómo se previenen y se valoran los riesgos, y el mapa de tareas del personal de limpieza.",L:[
{t:"La normativa que te protege",ico:"⚖️",min:7,src:"Ley 31/1995, arts. 14, 18-22 y 29; RD 39/1997",obj:["Conocer la base legal de la prevención: Ley 31/1995 y RD 39/1997.","Identificar tus derechos de información, formación, participación y vigilancia de la salud.","Saber qué hacer ante un riesgo grave e inminente y cuáles son tus obligaciones."],b:[["1. Marco general",FIGI("assets/l01-marco.webp","Trabajadora de limpieza leyendo indicaciones preventivas junto al carro de servicio","La prevención se traduce en hábitos diarios: conocer los riesgos de cada tarea, aplicar las medidas y avisar cuando algo no está bien.")+"<p>La <b>Ley 31/1995 de Prevención de Riesgos Laborales</b> (LPRL) es la base del sistema preventivo en España. El <b>RD 39/1997</b>, Reglamento de los Servicios de Prevención, regula cómo se evalúan los riesgos y cómo se organiza la prevención.</p>"+UL(["La empresa <b>evalúa, planifica y revisa</b> los riesgos de cada puesto, organiza la prevención y te facilita medios seguros y los equipos de protección necesarios.","Tú <b>aplicas las instrucciones</b>, usas correctamente los equipos y las protecciones, colaboras y <b>comunicas las incidencias</b>, aunque no haya habido ningún daño."])+NOTE("<b>Este curso cumple la parte teórica de la formación del artículo 19 LPRL</b> para el puesto de personal de limpieza. Se completa con la información concreta de tu empresa y de cada centro de trabajo (evaluación de riesgos, plan de emergencias, equipos y productos que usas, normas del establecimiento) y con la formación práctica en tu puesto.")],["2. Información, formación y participación",LEY("Art. 19.1 Ley 31/1995: el empresario deberá garantizar que cada trabajador reciba una formación teórica y práctica, suficiente y adecuada, en materia preventiva, tanto en el momento de su contratación como cuando se produzcan cambios en las funciones que desempeñe o se introduzcan nuevas tecnologías o cambios en los equipos de trabajo. Su coste no recaerá en ningún caso sobre los trabajadores.")+UL(["Tienes derecho a recibir <b>información</b> sobre los riesgos de tu puesto y de los lugares donde trabajas, y sus medidas preventivas (art. 18), y a una <b>formación</b> suficiente, dentro de la jornada o descontando ese tiempo, y <b>sin coste</b> para ti (art. 19).","La formación se actualiza cuando cambian tus funciones, los equipos o los productos (por ejemplo, una fregadora nueva o un desinfectante distinto).","Puedes hacer propuestas de mejora y participar a través de los delegados de prevención o directamente con la empresa (arts. 18 y 33-36)."])],["3. Vigilancia de la salud y riesgo grave e inminente",UL(["La empresa te ofrecerá la <b>vigilancia de la salud</b> (art. 22). Por norma general es <b>voluntaria</b> y <b>confidencial</b>: la empresa solo conoce si eres apto o no para el puesto. Lo que corresponde desde el punto de vista médico lo decide el <b>médico del trabajo</b>.","Ante un <b>riesgo grave e inminente</b> (un hueco sin proteger, un producto que te produce una reacción intensa, un equipo que echa chispas) tienes derecho a <b>interrumpir la actividad y abandonar la zona</b> (art. 21), avisando enseguida a tu responsable."])+ALERT("<b>Tus obligaciones (art. 29):</b> usar adecuadamente los equipos, las herramientas y los productos; utilizar los equipos de protección; no anular los dispositivos de seguridad; informar de inmediato de cualquier situación de riesgo y cooperar con la empresa. Su incumplimiento puede considerarse falta laboral.")]],key:"La empresa evalúa, planifica y te da medios seguros; tú aplicas las instrucciones, usas las protecciones y comunicas. Tienes derecho a información, formación gratuita y adecuada, participación y vigilancia de la salud voluntaria y confidencial. Ante un riesgo grave e inminente, interrumpe, aléjate y avisa.",q:[["¿Qué ley es la base del sistema de prevención de riesgos laborales en España?",["La Ley 31/1995 de Prevención de Riesgos Laborales","El Estatuto de los Trabajadores únicamente","El Código Civil","La Ley de Seguridad Vial"],0],["La formación preventiva de tu puesto:",["Es gratuita para ti y se hace en la jornada o descontando ese tiempo","La pagas tú y fuera de horario","Solo es obligatoria para los encargados","Se hace una sola vez en la vida laboral"],0],["La vigilancia de la salud es, por norma general:",["Voluntaria y confidencial; la empresa solo conoce la aptitud","Obligatoria y pública","Un trámite que decide tu encargado","Un examen cuyos resultados se cuelgan en el tablón"],0],["Encuentras un hueco sin proteger en un rellano. Tienes derecho a:",["Interrumpir la actividad, alejarte y avisar enseguida","Seguir trabajando para no retrasar la habitación","Taparlo con un cubo y continuar","Esperar al final de la jornada para comentarlo"],0],["¿Cuál de estas es una obligación del trabajador (art. 29 LPRL)?",["Informar de inmediato de las situaciones de riesgo y usar las protecciones","Reparar los equipos eléctricos averiados","Decidir qué EPI compra la empresa","Evaluar los riesgos del puesto"],0]]},
{t:"Cómo se evalúan y se previenen los riesgos",ico:"🛡️",min:7,src:"Ley 31/1995, arts. 15 y 16; RD 39/1997, arts. 3-9",obj:["Aplicar el orden de las medidas: eliminar, sustituir, controlar, organizar y proteger.","Entender de forma general cómo se valoran los riesgos.","Comunicar los incidentes aunque nadie se haya lesionado."],b:[["1. Elegir la medida que actúa en el origen",FIGI("assets/l02-evaluacion.webp","Responsable y trabajadora de limpieza revisando una lista de comprobación junto al carro","La evaluación de riesgos sirve para decidir qué medidas se aplican y con qué prioridad.")+"<p>Un <b>peligro</b> es una fuente de daño, como un suelo mojado o un producto corrosivo. El <b>riesgo</b> depende de la posibilidad de sufrir ese daño y de su gravedad.</p>"+FLOW(["1 Eliminar","2 Sustituir","3 Controlar","4 Organizar","5 EPI"])+UL(["<b>Eliminar</b> el peligro: retirar un cubo en el paso o una escalera en mal estado.","<b>Sustituir</b>: usar un producto menos peligroso que sea igual de eficaz, o un carro en lugar de cargar a pulso.","<b>Controlar</b> el entorno: señalizar un suelo mojado, iluminar un pasillo, usar una escalera estable.","<b>Organizar</b>: repartir las habitaciones, prever pausas y no improvisar tareas para las que no tienes medios.","<b>EPI</b> (equipos de protección individual): calzado antideslizante, guantes, gafas o mascarilla. Son la <b>última barrera</b>, cuando el riesgo no se ha podido evitar de otro modo."])],["2. Cómo se valoran los riesgos (explicación general)","<p>La empresa, con su servicio de prevención, <b>evalúa</b> los riesgos que no se han podido evitar (art. 16 LPRL). Un método muy utilizado combina dos factores:</p>"+UL(["La <b>probabilidad</b> de que se produzca el daño (baja, media o alta).","La <b>consecuencia</b> o gravedad del daño (leve, grave o muy grave)."])+"<p>De esa combinación sale una <b>prioridad</b> para actuar: primero se atienden los riesgos más graves o más probables. En este curso <b>no verás valoraciones concretas de tu puesto</b>: lo importante es que conozcas los riesgos, las medidas y que comuniques lo que no está bien.</p>"+NOTE("La evaluación se revisa cuando cambian las tareas, los equipos, los productos o se ha producido un daño. Si en un centro aparece una condición nueva (un andamio, una obra, un producto distinto), comunícalo: puede ser necesario reevaluar.")],["3. Incidentes y casi accidentes","<p>Un <b>incidente</b> o «casi accidente» es un suceso que podría haber causado un daño y no lo ha hecho: resbalar sin caerte, un cubo que casi cae del carro, un pinchazo evitado. Comunicarlo permite corregir la causa <b>antes</b> de que alguien se lesione.</p>"+CASO("Un casi accidente en el baño","Al entrar en un baño pisas un charco de champú y das un resbalón, pero te agarras a la puerta y no caes.","No lo dejas pasar: secas, señalizas si hace falta y lo comunicas. Así se puede revisar el procedimiento o el calzado antes de que alguien se lesione.")]],key:"Las medidas se eligen en este orden: eliminar, sustituir, controlar, organizar y, en último lugar, el EPI. Los riesgos se valoran de forma general según probabilidad y gravedad, para fijar prioridades. Comunica también los incidentes en los que no ha habido daño.",q:[["El orden correcto de las medidas preventivas empieza por:",["Eliminar el peligro y, si no es posible, sustituirlo o controlarlo","Poner primero el EPI y luego ya se verá","Dejarlo a criterio de cada trabajador","Actuar solo cuando ya ha habido un accidente"],0],["El EPI es:",["La última barrera, cuando el riesgo no se ha podido evitar de otro modo","La primera medida que hay que aplicar","Un adorno de la ropa de trabajo","Obligatorio solo para el encargado"],0],["La evaluación de riesgos combina, de forma general:",["La probabilidad de que ocurra un daño y su gravedad","Solo el número de trabajadores del centro","La antigüedad de la empresa","La marca de los productos de limpieza"],0],["En este curso, las valoraciones concretas de cada riesgo (prioridad o gravedad de un caso particular):",["No se muestran; se explica el método y las medidas que debes aplicar","Aparecen en cada lección con una nota numérica","Las calcula cada alumno al final","Solo las ve quien aprueba el examen"],0],["Resbalas en un pasillo pero no llegas a caerte. Debes:",["Comunicarlo: un incidente sirve para corregir la causa a tiempo","No decir nada porque no te has hecho daño","Reírte y seguir","Esperar a que le pase a otra persona"],0]]},
{t:"Mapa de tareas y riesgos del personal de limpieza",ico:"🗺️",min:7,src:"Ley 31/1995, art. 16; evaluación de riesgos del puesto",obj:["Reconocer las tareas habituales del puesto.","Relacionar cada bloque de tareas con sus riesgos principales.","Saber qué no forma parte de tu trabajo habitual."],b:[["1. Qué hace el puesto",FIGI("assets/l03-tareas.webp","Trabajadora de limpieza con el carro de servicio frente a una habitación ordenada","El puesto combina limpieza de superficies, reposición, manejo de carros y, a veces, trabajo en centros distintos cada día.")+"<p>El personal de limpieza <b>acondiciona y pone a punto</b> habitaciones, baños, zonas comunes y espacios anexos, a menudo en <b>instalaciones ajenas</b> (hoteles, oficinas, residencias u otros establecimientos). Las tareas habituales incluyen:</p>"+UL(["Limpieza manual de superficies, mobiliario, sanitarios, cristales y suelos.","Reposición de productos de acogida y de textiles (ropa de cama, toallas, amenities).","Uso de útiles (bayetas, mopas, cepillos, cubos) y del <b>carro de servicio</b>.","Uso de <b>escalera de mano</b> para puntos bajos (menos de 2 metros) y de maquinaria portátil (aspiradora, fregadora compacta).","Manejo de <b>productos químicos</b> de limpieza y desinfección.","Retirada de residuos y, en ocasiones, movimiento de mobiliario ligero para acceder a una zona."])],["2. De dónde salen los riesgos",UL(["<b>Caídas y golpes:</b> suelos mojados, objetos en el paso, escaleras, carros y mobiliario.","<b>Productos químicos:</b> contacto con la piel u ojos e inhalación de vapores o aerosoles.","<b>Agentes biológicos:</b> residuos, fluidos o materiales sucios en baños, habitaciones o cubos.","<b>Carga física:</b> estar de pie, movimientos repetitivos de brazos y muñecas, empujar el carro y mover cargas (ropa, productos, mobiliario ligero).","<b>Electricidad y equipos:</b> aspiradoras, fregadoras, alargadores y tomas del centro.","<b>Organización y trato con personas:</b> ritmo de trabajo, fatiga, clientes o usuarios, y desplazamiento entre centros."])+NOTE("El trabajo puede ser <b>itinerante</b>: cambias de centro o de planta y no siempre conoces el estado del mobiliario, las salidas de emergencia o las tomas eléctricas. Por eso, <b>reconocer el lugar al llegar</b> es una medida de seguridad, no una pérdida de tiempo.")],["3. Lo que no es tu tarea",UL(["La <b>limpieza de cristales con riesgo de caída en altura</b> (ventanas exteriores, voladizos, o cualquier acceso que exija arnés o medios de trabajos en altura) no la realiza el personal de limpieza de habitaciones: la asume personal formado y autorizado, o una empresa especializada.","No uses sillas, mesas, camas o cubos como escalera.","No realices trabajos eléctricos, ni reparaciones de equipos, ni tareas que exijan un arnés o superar los 2 metros sin protección.","Si te piden algo fuera de lo previsto, <b>consulta a tu responsable</b> antes de hacerlo."])+CASO("Una ventana alta","En un pasillo te piden limpiar el exterior de una ventana que solo se alcanza asomándose o con una escalera alta, cerca de un desnivel.","No lo haces. Esa tarea queda fuera de tu puesto. Lo comunicas a tu responsable para que la asuma quien tenga medios, formación y autorización.")]],key:"El puesto combina limpieza de habitaciones y zonas comunes, reposición, carros, escalera de mano baja y productos químicos, a menudo en centros ajenos. Los riesgos principales son caídas, químicos, biológicos, carga física, electricidad y la organización del trabajo. La limpieza de cristales en altura y los trabajos que exigen arnés no son tarea tuya.",q:[["Una tarea habitual del personal de limpieza es:",["Limpiar superficies y suelos, reponer textiles y usar el carro de servicio","Reparar la instalación eléctrica del centro","Colgarse de un arnés para limpiar fachadas","Conducir la caldera del edificio"],0],["El trabajo en centros ajenos implica, sobre todo:",["Reconocer el lugar al llegar, porque las condiciones cambian de un centro a otro","Dar por hecho que todos los hoteles son iguales","Empezar a limpiar sin mirar el entorno","Usar el mobiliario del cliente como escalera"],0],["La limpieza de cristales con riesgo de caída en altura:",["No es tarea del personal de limpieza de habitaciones; la hace personal autorizado o una empresa especializada","Se hace subiéndose a una silla junto a la ventana","Es obligatoria si te lo pide un cliente","Se puede hacer con un cubo volcado como peldaño"],0],["Entre los riesgos típicos del puesto no está:",["El manejo de explosivos de voladura","El contacto con productos químicos de limpieza","Las caídas al mismo nivel por suelos mojados","La carga física por carros y ropa"],0],["Si te piden una tarea que no es la habitual y no tienes medios seguros:",["Consultas a tu responsable antes de hacerla","La haces para no quedar mal","Pides a un compañero que te alce","La dejas para el final y la improvisas"],0]]}
]};
const M2={t:"Trabajo en centros ajenos y coordinación",fmin:3,s:"Reconocer cada centro al llegar, coordinarse con las demás empresas y trabajar con iluminación suficiente.",L:[
{t:"Reconocer el lugar de trabajo",ico:"📍",min:6,src:"RD 486/1997; RD 171/2004; Ley 31/1995, art. 18",obj:["Identificar, al llegar, las condiciones del centro que afectan a tu seguridad.","Localizar salidas, alarmas y zonas de riesgo antes de empezar.","Comunicar lo que no esté en condiciones."],b:[["1. Al llegar al centro",FIGI("assets/l04-lugar.webp","Trabajadora de limpieza observando un pasillo de hotel y las señales de emergencia al llegar","En un centro ajeno, los primeros minutos sirven para orientarte: salidas, suelos, recintos y normas del establecimiento.")+"<p>Cuando trabajas en <b>instalaciones de otra empresa</b> (un hotel, una oficina, una residencia…), las condiciones cambian de un día a otro y de un centro a otro. Antes de empezar, dedica un momento a <b>reconocer el lugar</b>.</p>"+UL(["Localiza las <b>salidas de emergencia</b>, el punto de reunión, los extintores y cómo dar la alarma.","Fíjate en suelos, desniveles, huecos, cables, obras o zonas acotadas.","Identifica el cuarto de lencería, el almacén de productos, los cuartos de basura y las tomas de agua y electricidad que vas a usar.","Pregunta las <b>normas del centro</b> que te afectan: horarios de no molestar, zonas restringidas, uso de ascensores de servicio."])],["2. Condiciones que debes comunicar",UL(["Huecos, barandillas sueltas, iluminación insuficiente o un suelo irregular o muy deslizante.","Enchufes rotos, cables pelados u olor a quemado.","Productos sin etiqueta, envases deteriorados o un almacén desordenado.","Presencia de obras, andamios o zonas que no estaban el día anterior."])+ALERT("No inicies una tarea si el lugar no está en condiciones seguras (un hueco sin proteger, una escalera en mal estado, un vertido no recogido). Comunícalo y espera indicaciones.")+CASO("Una planta en obras","Llegas a la planta y hay un tramo de pasillo con el suelo levantado y sin señalizar bien.","No cruzas improvisando ni desplazas las vallas. Avisas a tu responsable y al centro para que acoten y te indiquen un itinerario seguro.")]],key:"En un centro ajeno, al llegar localiza salidas, alarmas, zonas de riesgo y las normas del establecimiento. Comunica huecos, fallos eléctricos, falta de luz o cualquier condición insegura y no empieces la tarea hasta que se pueda trabajar con seguridad.",q:[["Al llegar a un centro ajeno, lo primero es:",["Reconocer el lugar: salidas, alarmas, suelos y normas que te afectan","Empezar por la habitación más lejana sin mirar el entorno","Dejar el carro en medio del pasillo y preguntar después","Buscar solo el office de café"],0],["Debes conocer en cada centro:",["Las salidas de emergencia, el punto de reunión y cómo dar la alarma","El nombre de todos los clientes alojados","La contraseña del wifi de las habitaciones","La facturación del establecimiento"],0],["Encuentras un hueco en el suelo sin proteger:",["No inicias la tarea en esa zona, lo comunicas y esperas a que se proteja","Lo saltas con cuidado y sigues","Lo tapas con una toalla","Lo dejas para el final de la jornada"],0],["Una condición nueva respecto al día anterior (obras, un andamio, un desnivel):",["La comunicas y te informas del itinerario seguro","Das por hecho que no te afecta","Pasas por debajo del andamio si tienes prisa","Pides a un cliente que te ayude a cruzar"],0]]},
{t:"Coordinación de actividades empresariales",ico:"🤝",min:6,src:"Ley 31/1995, art. 24; RD 171/2004",obj:["Entender qué es la coordinación de actividades empresariales.","Saber qué información recibes y qué debes comunicar.","Actuar cuando coinciden varias empresas en el mismo centro."],b:[["1. Varias empresas en el mismo lugar",FIGI("assets/l05-coordinacion.webp","Trabajadora de limpieza y responsable del centro consultando el plano de evacuación en recepción","En un hotel u oficina coinciden el titular del centro, limpieza, mantenimiento y a veces obras: hay que coordinarse.")+"<p>Cuando en un mismo centro trabajan varias empresas (titular del establecimiento, limpieza, mantenimiento, obras, seguridad…), la ley obliga a <b>coordinarse</b> para que los riesgos de unas no afecten a las otras (<b>art. 24 LPRL y RD 171/2004</b>).</p>"+UL(["El <b>titular del centro</b> informa de los riesgos del lugar, las medidas y el plan de emergencia.","Tu <b>empresa</b> gestiona ese intercambio de información y te traslada las instrucciones.","Tú <b>aplicas las instrucciones</b> recibidas y comunicas los riesgos que generas o detectas (un suelo mojado, un producto derramado, un equipo en mal estado)."])],["2. En la práctica",UL(["Respeta las <b>zonas restringidas</b> (cuartos de máquinas, obras, cubiertas, cuadros eléctricos).","Señala y avisa si tu tarea puede afectar a otros: un pasillo recién fregado, un carro en una esquina, un producto en uso.","No uses equipos ni instalaciones del centro o de otras empresas sin autorización (escaleras altas, máquinas de mantenimiento, productos que no son los tuyos).","Si el cliente o el personal del centro te pide una tarea o un medio distinto de lo previsto, <b>consulta antes con tu responsable</b>."])+CASO("Una escalera del hotel","Un trabajador del centro te ofrece su escalera de tijera, más alta de lo habitual, para limpiar una lámpara sobre el hueco de la escalera.","No la usas por tu cuenta. Puede no ser un equipo adecuado para ti y la tarea puede superar lo previsto. Lo consultas con tu responsable.")]],key:"Cuando coinciden varias empresas hay que coordinarse: el titular informa de los riesgos y la emergencia, tu empresa te traslada las instrucciones y tú las aplicas y comunicas los riesgos que generas o detectas. Ante tareas o equipos no previstos, consulta antes.",q:[["La coordinación de actividades empresariales se regula en:",["El art. 24 de la LPRL y el RD 171/2004","El Código Penal","La normativa de tráfico","El convenio de hostelería únicamente"],0],["¿Quién informa de los riesgos del lugar y del plan de emergencia?",["El titular del centro, y tu empresa te traslada las instrucciones","Los clientes alojados","Nadie, cada uno se informa solo","El proveedor de amenities"],0],["Tu fregado va a dejar el pasillo mojado, por el que pasa mantenimiento:",["Lo señalizas y avisas","No dices nada","Esperas a que alguien resbale","Lo dejas sin señal porque «ya se seca»"],0],["El personal del centro te presta una escalera alta para una lámpara sobre un hueco:",["Consultas antes con tu responsable","La usas sin más","Te subes a la barandilla","Lo haces mientras nadie mira"],0]]},
{t:"Iluminación de las zonas de trabajo",ico:"💡",min:5,src:"RD 486/1997, anexo IV",obj:["Reconocer cuándo la iluminación es insuficiente para trabajar con seguridad.","Actuar sin improvisar en zonas oscuras.","Comunicar fallos de luz en pasillos, habitaciones y zonas de servicio."],b:[["1. Ver para no caerte ni equivocarte",FIGI("assets/l06-iluminacion.webp","Pasillo de hotel bien iluminado, con el carro de limpieza en un lateral y el suelo despejado","Una zona mal iluminada aumenta el riesgo de tropiezos, choques y errores al dosificar un producto.")+"<p>Debe mantenerse un nivel de <b>iluminación adecuado y suficiente</b> en habitaciones, baños, pasillos, escaleras, almacenes, cuartos de lencería y zonas de servicio. Una zona oscura dificulta ver un charco, un objeto en el suelo o la etiqueta de un producto.</p>"+UL(["Antes de entrar en una habitación, un baño o un almacén, enciende la luz. No trabajes a oscuras ni solo con la luz del pasillo.","En zonas interiores sin ventana (escaleras de servicio, trasteros), comprueba que la luz funciona antes de cargar el carro o de bajar un tramo.","Evita deslumbramientos o contrastes fuertes cuando limpies cristales o superficies brillantes; cambia la postura o la cortina si puedes hacerlo con seguridad."])],["2. Si falta luz",UL(["No improvises con el móvil como única luz en una escalera o un cuarto de máquinas.","Comunica las lámparas fundidas, los interruptores que fallan o los tramos oscuros.","Si no puedes trabajar con seguridad, no sigas en esa zona hasta que se restablezca la iluminación."])+CASO("El office a oscuras","El cuarto de lencería tiene la luz fundida y solo entra un poco de claridad del pasillo.","No entras a buscar ropa a tientas. Lo comunicas y usas otro espacio iluminado, o esperas a que reparen la lámpara.")]],key:"Trabaja siempre con luz suficiente: enciende al entrar, comprueba escaleras y almacenes y no improvises en la oscuridad. Comunica las lámparas fundidas y no sigas en una zona si no puedes ver con seguridad.",q:[["Una iluminación insuficiente aumenta sobre todo el riesgo de:",["Tropiezos, choques y errores al manejar productos","Resfriados","Cortes solo en la cocina","Accidentes de tráfico"],0],["Antes de entrar en un almacén o un baño interior:",["Enciendes la luz y compruebas que puedes ver bien","Entras con el móvil a oscuras","Dejas la puerta entreabierta y trabajas así","Esperas a que se acostumbre el ojo"],0],["Encuentras un tramo de escalera de servicio a oscuras:",["No lo usas como paso habitual, lo comunicas y buscas un itinerario seguro","Bajas a pulso agarrándote a la pared","Lo iluminas solo con el flash del teléfono y cargas el carro","Pides a un compañero que te empuje el carro a ciegas"],0],["Una lámpara fundida en el office:",["Se comunica para que se repare; no se trabaja a tientas","Se ignora si ya conoces el cuarto","Se sustituye por una vela","Es un asunto solo del jefe de recepción"],0]]}
]};
const M3={t:"Caídas, suelos y trabajo en altura",fmin:3,s:"Cómo evitar resbalones y tropiezos, usar la escalera de mano y no improvisar trabajos en altura.",L:[
{t:"Suelos mojados, orden y calzado",ico:"💧",min:7,src:"RD 486/1997, anexos I y II; UNE-EN ISO 20347",obj:["Mantener despejadas y secas las zonas de trabajo y de paso.","Actuar de inmediato ante un suelo mojado o un vertido.","Usar calzado de trabajo antideslizante."],b:[["1. El orden es una medida de seguridad",FIGI("assets/l07-suelos.webp","Pasillo con el suelo seco, el carro de limpieza encostado a un lado y una señal de suelo mojado","Un cubo, una sábana o un charco en el paso bastan para provocar un resbalón o un tropiezo.")+"<p>Las <b>caídas al mismo nivel</b> son uno de los accidentes más frecuentes en la limpieza. Se previenen sobre todo con <b>orden, limpieza inmediata y calzado adecuado</b>.</p>"+UL(["No dejes cubos, mopas, bayetas, bolsas, perchas ni ropa en zonas de paso, rellanos o en medio de la habitación más tiempo del necesario.","Al terminar cada habitación o zona, recoge y deja el paso despejado.","Mantén el carro estable, cerca de la pared o en el lugar acordado, sin bloquear salidas ni escaleras.","Recoge enseguida los residuos y los envoltorios: no los dejes «para el final del pasillo»."])],["2. Suelos mojados o deslizantes",UL(["El fregado, un vertido de producto, el agua de la ducha o el jabón en el baño dejan el suelo <b>muy deslizante</b>.","<b>Señaliza</b> el riesgo de inmediato con la señal de suelo mojado, visible y en el sentido de circulación.","Friega por tramos, deja un paso seco cuando puedas y seca bien, sobre todo en entradas, ascensores y escaleras.","Si se derrama un producto o un líquido, recógelo cuanto antes y seca el piso. No dejes el charco «a que se seque solo»."])+CASO("Charco en el rellano","Al salir de una habitación ves que el cubo ha perdido agua en el rellano, junto a las escaleras.","Paras, señalizas, recoges y secas antes de seguir. No dejas el charco ni pides a quienes pasan que «tengan cuidado» sin más.")],["3. Calzado de trabajo","<p>Usa <b>calzado de trabajo antideslizante</b> (por ejemplo, con especificación UNE-EN ISO 20347), cerrado, sujeto al pie y en buen estado. No trabajes con calzado liso, abierto o con la suela gastada.</p>"+NOTE("El calzado es un EPI de uso diario en este puesto. Si está deteriorado, pídelo de recambio; no lo sustituyas por calzado de calle.")]],key:"Mantén despejadas las zonas de paso y recoge al terminar cada tarea. Si el suelo está mojado o hay un vertido, señalízalo, recógelo y sécalo. Trabaja con calzado antideslizante cerrado y en buen estado.",q:[["La medida que más reduce tropiezos y resbalones en la limpieza es:",["El orden, recoger enseguida y señalizar y secar los suelos mojados","Trabajar más deprisa para terminar antes","Dejar los útiles en el paso para tenerlos a mano","Usar zapatillas de casa, más cómodas"],0],["Cuando friegas un pasillo debes:",["Señalizar el suelo mojado y, si puedes, dejar un paso o secar al terminar el tramo","Fregar todo de una vez y no avisar","Quitar la señal en cuanto pases la fregona, aunque siga mojado","Pedir a los clientes que crucen por el tramo mojado"],0],["Se derrama producto en el suelo:",["Lo recoges y secas de inmediato, y señalizas mientras tanto","Lo dejas a que se evapore","Lo cubres con una toalla y sigues","Solo lo limpias si es muy visible"],0],["El calzado de trabajo de este puesto debe ser:",["Antideslizante, cerrado y en buen estado","El que tú elijas, aunque sea una chancla","Obligatorio solo en días de lluvia","Igual que el de calle, si es negro"],0]]},
{t:"Caídas a distinto nivel: escaleras de mano",ico:"🪜",min:7,src:"RD 486/1997; RD 1215/1997, anexo II (escaleras de mano)",obj:["Usar solo medios adecuados para trabajar por encima del suelo.","Colocar y usar la escalera de mano de forma segura.","Saber qué tareas en altura quedan prohibidas para este puesto."],b:[["1. Nunca improvises un peldaño",FIGI("assets/l08-alturas.webp","Trabajadora de limpieza subida a una escalera de mano estable, de frente al trabajo, para alcanzar una baldilla","La escalera de mano, bien colocada y en buen estado, es el medio adecuado; una silla o la cama no lo son.")+"<p>Para tareas por encima del nivel del suelo (baldas, cortinas, lámparas bajas, altillos) usa siempre un <b>medio auxiliar adecuado, estable y en buen estado</b>: normalmente una <b>escalera de mano</b> correctamente colocada. Queda prohibido subirse a sillas, mesas, camas, cubos, cajas o cualquier mobiliario que no esté diseñado para ello.</p>"+UL(["Antes de usarla, comprueba que la escalera está entera, antideslizante en los apoyos, sin peldaños flojos y con los topes o tirantes de apertura en su sitio.","Colócala sobre suelo horizontal y estable, bien abierta, y de forma que puedas trabajar de frente, sin estirarte de lado.","Mantén <b>tres puntos de apoyo</b> (dos pies y una mano, o dos manos y un pie). No subas al último peldaño ni te asomes de lado.","Baja los tramos de escalera fija mirando al sentido del descenso, con una mano en el pasamanos y sin cargar de más."])],["2. El límite de tu puesto",ALERT("Está prohibido realizar trabajos en altura por encima de <b>2 metros</b> si no hay protección adecuada, y el personal de limpieza <b>no está habilitado</b> para usar arnés ni sistemas anticaídas. Esas tareas las asume personal formado y autorizado o una empresa especializada.")+UL(["Tampoco limpies cristales o superficies que impliquen riesgo de caída al vacío (ventanas exteriores, voladizos, aberturas).","No retires barandillas, tapas ni protecciones colectivas. Si falta una protección o hay un hueco, <b>no sigas y comunícalo</b>.","Las trabajadoras embarazadas no deben exponerse a trabajos en altura; cualquier adaptación del puesto la indica el <b>médico del trabajo</b>."])+CASO("La lámpara del rellano","Te piden cambiar el tulipa de una lámpara sobre el hueco de la escalera, a más de dos metros, sin barandilla interior.","No lo haces. Superaría el límite de tu puesto y no tienes protección colectiva ni autorización para un sistema anticaídas. Lo comunicas para que lo haga quien corresponda.")]],key:"Usa solo escalera de mano en buen estado, bien colocada y con tres puntos de apoyo. Nunca te subas a sillas, mesas o cubos. Por encima de 2 metros o con riesgo de caída al vacío (cristales exteriores, arnés) la tarea no es tuya: comunícala.",q:[["Para alcanzar una balda alta debes:",["Usar una escalera de mano estable, en buen estado y bien colocada","Subirte a la silla o a la cama","Apilar cubos y cajas","Pedir que te alcen en volandas"],0],["En la escalera de mano hay que mantener:",["Tres puntos de apoyo y no subir al último peldaño","Solo un pie, para llegar más lejos","Las dos manos ocupadas con el cubo","La escalera medio cerrada, que ocupa menos"],0],["Los trabajos por encima de 2 metros o que exigen arnés:",["Quedan fuera de este puesto; los hace personal autorizado o una empresa especializada","Los hace quien se ofrezca","Se improvisan con la escalera del office","Son obligatorios si te lo pide un cliente"],0],["Ves un hueco o una barandilla suelta:",["No sigues en esa zona y lo comunicas de inmediato","Sigues si tienes prisa","Lo tapas con el carro","Lo comentas al final de la semana"],0],["Limpiar el exterior de una ventana con riesgo de caída:",["No es tarea del personal de limpieza de habitaciones","Se hace abriendo la hoja y asomándose","Se hace con un cubo como peldaño","Solo está prohibida si llueve"],0]]},
{t:"Pisadas sobre objetos y zonas de paso",ico:"🧹",min:5,src:"RD 486/1997",obj:["Mantener suelos y pasos libres de objetos.","Recoger al momento lo que pueda pisarse.","Prestar atención en habitaciones, pasillos y almacenes."],b:[["1. Lo que se pisa, tropieza",FIGI("assets/l09-pisadas.webp","Suelo de habitación despejado, con la ropa y los útiles sobre el carro y no en el paso","Un tapón, una percha o un envoltorio en el suelo bastan para un tropezón, sobre todo en un centro que no es el tuyo.")+"<p>En habitaciones, baños, pasillos, almacenes y cuartos de lencería es fácil dejar —o encontrarte— objetos en el suelo: envoltorios, tapones, perchas, restos de amenities, bayetas o una sábana. Pisarlos puede causar un tropiezo o una lesión en el pie.</p>"+UL(["Integra la recogida en la propia tarea: lo que quitas, al cubo o al carro, no al suelo «un momento».","Deja las zonas de paso libres, también detrás de la puerta y junto a la cama.","Garantiza buena iluminación para ver lo que hay en el suelo.","Si encuentras un objeto inestable, roto o que no te corresponde retirar (un cristal grande, un aparato), no lo improvises: comunícalo."])+NOTE("Usa calzado de trabajo cerrado y antideslizante: también protege el pie si pisas algo inesperado.")]],key:"Mantén el suelo libre de objetos y recoge en el momento. Deja despejados los pasos, ilumina bien y comunica lo que no te corresponde retirar. El calzado cerrado también protege el pie.",q:[["Para evitar pisadas sobre objetos conviene:",["Recoger en el momento y dejar las zonas de paso libres","Acumular envoltorios en un rincón hasta el final","Trabajar a oscuras si ya conoces la habitación","Dejar las bayetas en el suelo, más a mano"],0],["Encuentras un cristal grande o un objeto que no te corresponde retirar:",["No lo improvisas y lo comunicas","Lo envuelves en una toalla y lo llevas bajo el brazo","Lo empujas con el pie hasta el cubo","Lo escondes bajo la cama"],0],["El calzado cerrado en este riesgo sirve para:",["Proteger el pie si pisas algo inesperado","Solo para el frío","Cumplir un uniforme estético","Nada, da igual que sea abierto"],0]]}
]};
const M4={t:"Golpes, cortes, objetos y contactos térmicos",fmin:3,s:"Almacenaje seguro, choques y cortes, proyección, atrapamientos y quemaduras en el puesto.",L:[
{t:"Caída de objetos y almacenaje",ico:"📦",min:5,src:"RD 486/1997",obj:["Almacenar de forma estable, sin sobrecargar baldas ni el carro.","Bajar objetos con apoyo y sin sobrecargar las bandejas.","Comunicar estanterías o cargas inestables."],b:[["1. Que no se caiga nada encima",FIGI("assets/l10-objetos.webp","Estantería de lencería ordenada, con lo más pesado abajo y los paquetes bien apoyados","Una pila inestable de sábanas o de productos puede caer al abrir un armario o al pasar el carro.")+"<p>Los objetos pueden caer por un almacenaje inestable, una balda sobrecargada, un apilamiento improvisado o al manipular paquetes de ropa, bidones o cajas. En centros ajenos, el estado de armarios y estanterías no siempre es el que tú dejarías.</p>"+UL(["Coloca lo <b>más pesado y voluminoso abajo</b>, y lo ligero arriba, sin que sobresalga del estante.","No sobrecargues baldas, el techo del carro ni la parte alta de los armarios.","Cierra puertas y cajones; no dejes un armario abierto en el paso.","Al bajar un paquete, acércalo al cuerpo, comprueba que está entero y pide ayuda si es incómodo o inestable.","Si ves una estantería floja, un apilamiento peligroso o un objeto a punto de caer, no lo fuerces: comunícalo."])]],key:"Almacena de forma estable, con lo pesado abajo y sin sobrecargar. Baja los bultos con apoyo, cierra armarios y comunica cualquier estantería o pila insegura.",q:[["En una estantería, lo más pesado debe ir:",["Abajo, bien apoyado y sin sobresalir","Arriba, para que no estorbe","En el borde, más a mano","Encima del carro, da igual"],0],["Ves una pila de cajas inestable en un almacén ajeno:",["No la fuerzas y lo comunicas","Tiras de ella para ordenarla a tu manera","Pasa el carro rozándola","La subes tú a un altillo"],0],["Al bajar un paquete de ropa de una balda alta:",["Lo acercas al cuerpo y compruebas que está entero","Lo tiras al suelo y luego lo recoges","Lo bajas con una sola mano mientras subes el cubo","Lo empujas con la escalera"],0]]},
{t:"Choques, golpes y cortes",ico:"🩹",min:6,src:"RD 486/1997; RD 1215/1997",obj:["Anticipar choques con mobiliario, puertas y carros.","Manejar con cuidado útiles que cortan o golpean.","Proteger las manos y no dejar herramientas en el paso."],b:[["1. Choques con lo fijo y con lo que se mueve",FIGI("assets/l11-cortes.webp","Trabajadora de limpieza pasando el carro con holgura en un pasillo, alejándolo de las esquinas","Las esquinas, las puertas a medio abrir y un carro mal guiado son causa habitual de golpes.")+"<p>En habitaciones y pasillos hay muchos elementos fijos (esquinas de muebles, lavabos, camas, marcos) y otros que se mueven (puertas, carros, compañeros, clientes). Un golpe es más probable si vas deprisa, con el carro cargado o en un espacio estrecho.</p>"+UL(["Modera la marcha en esquinas, puertas y rellanos. Anuncia tu paso si no te ven.","Abre y cierra las puertas con la mano, no con el cuerpo ni con el carro. Cierra las que dejen un canto a la altura de la cabeza.","Guía el carro con las dos manos cuando puedas, a una distancia que te permita parar, y no lo dejes asomado a una esquina.","Cuidado con las puertas de ascensor y de office: no introduzcas el cuerpo o la mano si está cerrándose."])],["2. Cortes y herramientas","<p>Cuchillas de cúter, tijeras, cristales, espejos, amenity rotos, tapas de latas o un canto metálico del carro pueden cortar.</p>"+UL(["Usa el útil adecuado y en buen estado; no fuerces una tapa ni un blister con la mano o los dientes.","Los cristales y espejos rotos se recogen con recogedor y bayeta gruesa o guante adecuado, nunca con la mano desnuda, y se tiran al contenedor indicado, bien protegidos.","Mantén las manos alejadas de cantos al mover camas, mesillas o el propio carro.","No dejes cúter, tijeras ni cristales sobre la cama o el suelo."])+CASO("Un vaso roto en el baño","Al entrar ves un vaso de cristal hecho añicos junto al lavabo.","No lo recoges con la mano. Proteges la zona, lo recoges con recogedor y protección, lo depositas de forma segura y, si hace falta, lo comunicas.")]],key:"Modera la marcha, controla puertas y carros y anuncia tu paso. Para cristales y útiles de corte usa el medio adecuado, nunca la mano desnuda, y deja las herramientas recogidas.",q:[["Para evitar choques con el carro conviene:",["Moderar la marcha, guiarlo con control y no dejarlo en una esquina","Ir el máximo de rápido para terminar el pasillo","Empujar la puerta con el frente del carro","Dejarlo en medio del rellano"],0],["Un cristal roto se recoge:",["Con recogedor y protección, nunca con la mano desnuda","Con los dedos, con cuidado","Barriéndolo hacia un rincón","Pidiéndole a un cliente que lo pise"],0],["Las puertas de habitación o de office:",["Se abren y cierran con la mano, sin dejar el canto a la altura de la cabeza","Se golpean con el carro para ir más rápido","Se dejan a medio abrir siempre","Da igual cómo se traten"],0],["Cúter o tijeras, al terminar de usarlos:",["Se recogen; no se dejan en la cama ni en el suelo","Se clavan en el jabón, para no perderlos","Se guardan en el bolsillo abierto","Se dejan en el lavabo"],0]]},
{t:"Proyección de partículas y atrapamientos",ico:"⚙️",min:6,src:"RD 1215/1997; RD 773/1997",obj:["Evitar que salten líquidos, polvo o fragmentos a los ojos.","No introducir las manos en equipos o en puntos de atrapamiento.","Usar la protección indicada y desconectar antes de intervenir."],b:[["1. Lo que puede saltar a la cara",FIGI("assets/l12-proyeccion.webp","Trabajadora de limpieza con gafas de protección dosificando un producto en el cubo, lejos de la cara","Un salpicón de lejía, un chorro a presión o el polvo de un aspirado pueden alcanzar los ojos.")+"<p>Al dosificar, pulverizar, frotar inodoros, usar agua a presión o vaciar un cubo puede saltar líquido o partículas. También al manipular un envase a presión o al sacudir textiles muy polvorientos.</p>"+UL(["Dosifica a la altura del cubo, no a la altura de la cara, y no mezcles a chorro violento.","No acerques la cara al inodoro, al desagüe o al envase al aplicar el producto.","Usa las <b>gafas de protección contra riesgo químico</b> cuando la tarea o la ficha del producto lo indiquen (salpicaduras, pulverizado, desincrustado).","Si te entra producto en el ojo, lava con agua abundante y avisa; la valoración médica corresponde al <b>médico del trabajo</b> o a urgencias, según el caso."])],["2. Atrapamientos","<p>Puertas, cajones, el mecanismo de una cama articulada, el rodillo de una fregadora o el cierre de un ascensor pueden atrapar una mano o un pie.</p>"+UL(["No introduzcas la mano en un equipo en marcha ni intentes retirar un atasco con el aparato conectado.","Desconecta de la corriente y espera a que pare antes de cualquier intervención que te corresponda; si no te corresponde, avisa.","Cuidado al mover camas, colchones y puertas correderas: mantén los pies y las manos fuera de los puntos de cierre.","No uses anillos, pulseras largas ni ropa muy suelta junto a equipos con partes móviles."])+ALERT("Nunca anules un resguardo o un dispositivo de seguridad de una máquina. Si falta o está roto, no la uses y comunícalo.")]],key:"Dosifica lejos de la cara y usa gafas cuando haya riesgo de salpicadura. No metas las manos en equipos en marcha ni en puntos de cierre; desconecta antes y no anules resguardos.",q:[["Al aplicar un producto que puede salpicar debes:",["Mantener la cara alejada y usar gafas si está indicado","Acercar la cara para ver mejor el resultado","Pulverizar a la altura de los ojos","Mezclar a chorro fuerte en el cubo, junto a la cara"],0],["Si te entra un producto en el ojo:",["Lavas con agua abundante y avisas; la valoración médica no la decides tú","Te frotas con una bayeta","Sigues trabajando hasta el final del turno","Aplicas otro producto «para neutralizar» por tu cuenta"],0],["Para retirar un atasco de la fregadora o la aspiradora:",["La desconectas de la corriente y esperas a que pare","Meter la mano con el equipo enchufado","Darle un golpe seco mientras funciona","Pedir a un compañero que meta la mano él"],0],["Si un resguardo de una máquina falta o está anulado:",["No la usas y lo comunicas","La usas con más cuidado","La tapas con una bolsa","Solo importa en equipos grandes"],0]]},
{t:"Contactos térmicos",ico:"♨️",min:5,src:"RD 1215/1997; RD 486/1997",obj:["Identificar fuentes de calor y de frío en el puesto.","Evitar quemaduras con agua, vapor, planchas o tuberías.","No improvisar sobre superficies calientes o muy frías."],b:[["1. Calor y frío en la limpieza",FIGI("assets/l13-termico.webp","Trabajadora de limpieza comprobando que un aparato está frío antes de limpiarlo, con el cable desenchufado","Agua muy caliente, vapor, planchas, toalleros o tuberías pueden quemar; también el hielo o el metal muy frío.")+"<p>Aunque no trabajes en una cocina, en habitaciones y zonas de servicio hay <b>contactos térmicos</b>: agua caliente, vapor de la plancha o de un generador, secadores, toalleros eléctricos, radiadores, cafeteras de office, tuberías y, a veces, cámaras o cubitos muy fríos.</p>"+UL(["Antes de limpiar un aparato, <b>desenchúfalo y comprueba que está frío</b> (plancha, secador, toallero, cafetera).","Abre el agua caliente con precaución y no metas la mano en un cubo de agua recién muy caliente.","No apoyes bayetas ni productos sobre radiadores o lámparas calientes.","Cuidado con tuberías y válvulas no aisladas en cuartos técnicos: no las uses de apoyo.","Si debes entrar en un espacio muy frío (cámara o almacén), hazlo el tiempo imprescindible y con el procedimiento del centro; nunca te encierres."])+CASO("La plancha del office","Queda una plancha encendida sobre la tabla al final del turno anterior.","No la tocas ni la limpias en caliente. La desconectas, esperas a que se enfríe y, si no es tuya, avisas a quien corresponda.")]],key:"Desenchufa y deja enfriar los aparatos antes de limpiarlos. Ve con tiento el agua caliente, el vapor y las tuberías, y no improvises en espacios muy fríos.",q:[["Antes de limpiar una plancha o un toallero eléctrico:",["Lo desenchufas y compruebas que está frío","Lo limpias en caliente, que así sale mejor la suciedad","Tiras agua encima mientras está enchufado","Lo mueves tirando del cable"],0],["El agua muy caliente del cubo o del grifo:",["Puede quemar; se maneja con precaución","Nunca quema si es «de limpieza»","Se comprueba metiendo la mano de golpe","Se transporta corriendo para no enfriarla"],0],["Una tubería o un radiador muy caliente:",["No se usa de apoyo ni se cubre con bayetas o productos","Es un buen sitio para secar mopas","Se limpia con el producto más fuerte, en caliente","Se toca siempre para «comprobar la calefacción»"],0]]}
]};
const M5={t:"Electricidad y equipos de limpieza",fmin:3,s:"Contactos eléctricos y uso seguro de aspiradoras, fregadoras y demás maquinaria portátil.",L:[
{t:"Contactos eléctricos",ico:"⚡",min:7,src:"RD 614/2001; REBT (RD 842/2002)",obj:["Distinguir el riesgo de un contacto directo e indirecto.","Usar tomas, cables y alargadores en buen estado, nunca con las manos mojadas.","Actuar ante un equipo o un enchufe que falla."],b:[["1. Dónde está el riesgo",FIGI("assets/l14-electrico.webp","Toma de corriente de un pasillo con el enchufe entero y el cable de la aspiradora sin tirones ni empalmes","Con las manos mojadas o un cable deteriorado, el riesgo eléctrico aumenta aunque la tensión sea la de una toma doméstica.")+"<p>En la limpieza usas tomas del centro para aspiradoras, fregadoras, carros con base eléctrica o cargadores. Un <b>contacto directo</b> es tocar una parte que está en tensión (un cable pelado, un enchufe roto). Un <b>contacto indirecto</b> es tocar la carcasa de un aparato que se ha puesto en tensión por un fallo de aislamiento: por eso importan el estado del equipo y las protecciones de la instalación.</p>"+UL(["Nunca manipules un enchufe, un cuadro o un empalme: no es tu trabajo.","No uses equipos con el cable pelado, el enchufe roto, un empalme improvisado o la carcasa partida.","No tires del cable para desenchufar: tira de la clavija.","No encadenes ladrones ni sobrecargues una misma toma.","<b>Manos secas</b> al enchufar o desenchufar; no uses un equipo con el suelo encharcado ni con el conector mojado."])],["2. Si algo falla",ALERT("Si hay chispazos, olor a quemado, un aparato que da calambre o un enchufe caliente: <b>desconecta si puedes hacerlo sin riesgo, no sigas usándolo y comunica de inmediato</b>. No intentes repararlo.")+UL(["No mojes enchufes, alargadores ni la base de los equipos al fregar.","Al terminar, desconecta los equipos y recoge el cable sin dejarlo en el paso.","En un centro ajeno, no uses una toma que veas deteriorada; pídela de cambio o informa."])+CASO("La aspiradora «da calambre»","Al tocar la empuñadura notas un hormigueo.","Dejas de usarla, la desenchufas sin mojarte si es seguro, la retiras y lo comunicas. No la sigues usando ni la «pruebas» otra vez.")]],key:"No manipules la instalación. Usa solo equipos y cables en buen estado, con las manos secas y sin sobrecargar las tomas. Ante calambre, chispas u olor a quemado, desconecta si es seguro, no reparas y avisa.",q:[["Un contacto indirecto se produce cuando:",["Tocas la carcasa de un aparato que se ha puesto en tensión por un fallo","Solo cuando tocas un cable pelado","Únicamente en alta tensión","Nunca en un hotel"],0],["Para desenchufar un equipo debes:",["Tirar de la clavija, con las manos secas","Tirar del cable","Desenchufar con las manos mojadas, que aíslan","Golpear el enchufe con el cubo"],0],["Ves un cable pelado o un enchufe roto:",["No lo usas y lo comunicas; no lo reparas","Lo reparas con cinta aislante","Lo mojas para «limpiarlo»","Lo dejas para el siguiente turno sin avisar"],0],["Un aparato da calambre o huele a quemado:",["Dejas de usarlo, lo desconectas si es seguro y avisas","Lo sigues usando con guante","Lo golpeas para ver si se le pasa","Lo dejas enchufado «a ver si refresca»"],0],["Al fregar cerca de una toma:",["Evitas mojar el enchufe y los conectores","Echas agua a presión al rodapié de la toma","Enchufas la fregadora en un ladrón recargado","Dejas el alargador en el charco"],0]]},
{t:"Aspiradoras, fregadoras y equipos portátiles",ico:"🔌",min:6,src:"RD 1215/1997; instrucciones del fabricante",obj:["Usar cada equipo según sus instrucciones y en buen estado.","Recoger cables y no dejar el equipo como obstáculo.","No intervenir en averías que no te corresponden."],b:[["1. Uso seguro",FIGI("assets/l15-maquinas.webp","Trabajadora de limpieza guiando una fregadora compacta por un pasillo despejado, con el cable controlado","La maquinaria portátil ahorra esfuerzo si está en buen estado y se usa sin improvisar.")+"<p>Aspiradoras, fregadoras compactas, limpiamoquetas o secadores industriales son <b>equipos de trabajo</b>. Se usan según las instrucciones, con los resguardos puestos y solo para lo que están diseñados.</p>"+UL(["Revisa de un vistazo cable, enchufe, carcasa, ruedas y depósitos antes de empezar. Si algo no está bien, no lo uses y comunícalo.","No anules interruptores ni protecciones. No uses un equipo que salta el diferencial de forma repetida.","Controla el cable: no lo dejes en zonas de paso, no lo pises con la máquina y no lo enrolles en tenso alrededor de un eje caliente.","Vacía y limpia los depósitos donde corresponda, sin meter las manos en zonas de cepillos o turbinas conectadas.","El ruido de estos equipos puede molestar o fatigar: no los uses más tiempo del necesario, y comunica si un aparato suena de forma anómala (puede estar averiado)."])],["2. Después de usarlo",UL(["Desenchufa, recoge el cable y deja el equipo en su sitio, sin obstaculizar salidas.","No dejes un depósito lleno de agua sucia ni un cable a merced de un paso.","El mantenimiento y las reparaciones los hace personal autorizado, no el usuario."])+NOTE("Si no te han formado en un equipo concreto, no lo uses por tu cuenta: pide indicaciones prácticas en tu puesto.")]],key:"Usa la maquinaria portátil en buen estado, según sus instrucciones, con el cable controlado y sin anular protecciones. Al terminar, desenchufa y recoge. No repares ni uses un equipo que no conoces.",q:[["Antes de usar una fregadora o una aspiradora:",["Revisas cable, enchufe, carcasa y que no tenga un fallo evidente","La enciendes para «ver qué pasa» aunque el cable esté pelado","Le quitas el resguardo para llegar mejor","La usas con el depósito de otro modelo, si encaja a presión"],0],["El cable del equipo:",["Se mantiene fuera de las zonas de paso y no se tira de él","Se deja cruzando el rellano, más cómodo","Se pisa con la propia máquina para tensarlo","Se moja para que se adhiera al suelo"],0],["Una reparación o un mantenimiento del equipo:",["Lo hace personal autorizado, no el usuario","Lo hace cualquiera con un destornillador","Se improvisan en el office","Se deja para que lo haga un cliente"],0],["Si no te han enseñado a usar un equipo concreto:",["No lo usas por tu cuenta y pides formación práctica","Lo pruebas en una habitación vacía","Lo usas al revés, a ver si es igual","Miras un vídeo y ya vale"],0]]}
]};
const M6={t:"Productos químicos de limpieza",fmin:3,s:"Etiquetas y fichas, inhalación y contacto, y cómo diluir, no mezclar y almacenar con seguridad.",L:[
{t:"Etiquetas, pictogramas y fichas de seguridad",ico:"🧴",min:7,src:"Reglamento (CE) 1272/2008 (CLP); RD 374/2001",obj:["Leer la etiqueta antes de usar cualquier producto.","Reconocer los pictogramas de peligro más habituales.","Saber qué es la ficha de datos de seguridad y cuándo consultarla."],b:[["1. No uses un producto que no identifiques",FIGI("assets/l16-etiquetas.webp","Trabajadora de limpieza leyendo la etiqueta de un envase de producto de limpieza en un office ventilado","La etiqueta y la ficha de seguridad dicen qué es el producto, qué peligros tiene y cómo protegerte.")+"<p>En el puesto se usan detergentes, limpiacristales, lejías, desengrasantes, desincrustantes y desinfectantes. <b>Antes de usarlos</b>, identifica el envase y lee la etiqueta. No uses un producto sin etiqueta, con la etiqueta ilegible o decantado en una botella de agua o de refresco.</p>"+UL(["La etiqueta indica el nombre, los pictogramas de peligro, las frases de peligro y de prudencia, y el fabricante.","La <b>ficha de datos de seguridad</b> (FDS) amplia esa información: riesgos, EPI, primeros auxilios, almacenamiento y qué hacer en un derrame. Tu empresa debe tenerla a tu disposición.","Si un producto se está acabando, avisa a tiempo: improvisar con lo que haya en el office del centro o mezclar restos es una fuente habitual de incidentes."])],["2. Pictogramas que debes reconocer","<p>El Reglamento CLP usa pictogramas en rombo rojo. En limpieza son frecuentes, entre otros:</p>"+UL(["<b>Corrosión</b> (líquido que ataca una mano o una superficie): puede quemar la piel o los ojos.","<b>Signo de exclamación</b>: irritación, sensibilidad o toxicidad aguda menor.","<b>Peligro para la salud</b> (silueta) o <b>toxicidad aguda</b> (calavera): requieren precauciones estrictas y, a menudo, EPI específico.","<b>Llama</b>: inflamable. Lejos de focos de calor e ignición.","<b>Medio ambiente</b> (árbol y pez): no se vierte a la ligera por el desagüe ni al entorno."])+NOTE("No hace falta que memorices códigos internos. Sí debes <b>entender la etiqueta</b> y aplicar lo que dice. Si no la entiendes, no uses el producto y pregunta.")],["3. Embarazo, lactancia y sensibilidad","<p>Algunos productos no son adecuados en caso de embarazo, lactancia o de una sensibilidad especial. Eso no lo decides tú ni tu encargado: lo valora el <b>médico del trabajo</b>, a partir de la evaluación y de las fichas de los productos.</p>"+UL(["Si estás embarazada, en periodo de lactancia o tienes una sensibilidad que pueda verse afectada, <b>comunícalo a la empresa</b> para que se adapte el puesto si procede.","Mientras tanto, no uses un producto que te hayan indicado evitar, y consulta la etiqueta y la ficha de los que te asignen."])]],key:"Lee la etiqueta y no uses un producto sin identificar o decantado en un envase de bebida. La ficha de seguridad concreta el EPI, el almacenamiento y los primeros auxilios. El médico del trabajo valora las adaptaciones por embarazo, lactancia o sensibilidad.",q:[["Antes de usar un producto químico debes:",["Identificarlo y leer la etiqueta (y la ficha, si hace falta)","Olerlo para saber si es fuerte","Probarlo en la mano","Mezclarlo con otro «a ver si limpia más»"],0],["Un producto sin etiqueta o pasado a una botella de agua:",["No se usa; puede confundirse y causar un accidente","Se usa si el líquido es del mismo color","Se usa solo un poco, por si acaso","Se etiqueta de memoria al final del día"],0],["La ficha de datos de seguridad sirve para:",["Conocer riesgos, EPI, almacenamiento y qué hacer en un derrame o un contacto","Decorar el office","Sustituir a la etiqueta, que ya no hace falta","Uso exclusivo del fabricante"],0],["Las adaptaciones del puesto por embarazo o lactancia las decide:",["El médico del trabajo, con la información de la empresa","Tú, según te encuentres ese día","El cliente del centro","Un compañero con más antigüedad"],0],["Si no entiendes un pictograma o una frase de la etiqueta:",["No usas el producto y preguntas","Lo usas igual, «con cuidado»","Lo diluyes a ojo al doble","Lo pruebas en un rincón"],0]]},
{t:"Inhalación, contacto y uso seguro",ico:"🧤",min:7,src:"RD 374/2001; RD 773/1997",obj:["Ventilar y no inhalar vapores ni aerosoles innecesarios.","Evitar el contacto con la piel y los ojos, y usar el EPI indicado.","Actuar de forma inmediata ante un salpicón o una irritación."],b:[["1. Inhalación",FIGI("assets/l17-contacto.webp","Trabajadora de limpieza con guantes y gafas aplicando un producto en un baño con la ventana abierta","Ventilar, no pulverizar a la cara y usar el EPI de la ficha reduce la inhalación y el contacto.")+"<p>Los vapores, el pulverizado y los aerosoles se inhalan con facilidad en baños pequeños, office sin ventilación o al frotar con producto concentrado.</p>"+UL(["Ventila: abre ventana o puerta cuando la tarea lo permita, sobre todo con lejías, desincrustantes o desengrasantes.","No pulverices a contracorriente ni a la altura de la cara. No calientes el producto ni lo uses en más cantidad de la indicada.","Si la ficha indica mascarilla o filtro, úsala; no la sustituyas por un pañuelo.","Si notas irritación de garganta, tos, mareo o dificultad para respirar, interrumpe, sal al aire, avisa y no decidas tú el tratamiento: corresponde al personal sanitario."])],["2. Contacto con la piel y los ojos",UL(["Usa los <b>guantes</b> que indique la ficha (a menudo de nitrilo u otro material resistente al producto concreto; no vale cualquier guante de látex fino si la ficha pide otro).","Usa <b>gafas de protección de riesgo químico</b> cuando haya riesgo de salpicadura.","No toques la cara, las lentillas ni el móvil con el guante sucio.","Al terminar, quítate los guantes sin contaminarte y lávate las manos."])+ALERT("Ante un salpicón en ojos o piel: lava con agua abundante el tiempo indicado (suele ser de varios minutos), quita las lentillas si es fácil, avisa y acude a valoración sanitaria con la etiqueta o la ficha del producto. No apliques «neutralizantes» por tu cuenta.")],["3. Hábitos que importan",UL(["No comas, bebas ni fumes mientras usas productos, ni en el office si hay envases abiertos.","No uses el agua de un cubo o de un envase de producto para enjuagarte.","Cambia los guantes si se rompen o se saturan."])+CASO("Salpicón al desincrustar","Al aplicar un desincrustante en el inodoro te salpica cerca del ojo.","Cierras el envase, te enjuagas de inmediato con agua abundante, avisas y entregas la etiqueta del producto a quien te atienda. No te frotas y no sigues la habitación «a ver si se me pasa».")]],key:"Ventila, no pulverices a la cara y usa los guantes y gafas que indique la ficha. Ante un salpicón, lava con agua abundante y busca valoración sanitaria con la etiqueta. No comas, bebas ni fumes durante el uso.",q:[["Para reducir la inhalación de un producto:",["Ventilas, no pulverizas a la cara y no usas más cantidad de la indicada","Cierras el baño para que «actúe mejor»","Calientas el producto para que rinda más","Te agachas junto al cubo y aspiras para «comprobar el olor»"],0],["Los guantes se eligen:",["Según lo que indique la ficha del producto","Según el color del uniforme","El más fino, que da más tacto, siempre","Da igual el material"],0],["Un salpicón de producto en el ojo se trata así:",["Lavado inmediato con agua abundante, aviso y valoración sanitaria con la etiqueta","Frotarse con una bayeta","Echar otro producto encima para «neutralizar»","Seguir trabajando y mirar al final del turno"],0],["Durante el uso de productos químicos:",["No se come, bebe ni fuma","Se puede merendar si es un producto «suave»","Se bebe del cubo si es agua con detergente diluido","Se fuma junto a la ventana"],0],["Si un producto te irrita la garganta o te marea:",["Interrumpes, sales al aire, avisas y no te automedicas","Bebes leche y sigues","Pones más producto, a ver si es la dosis","Cierras más las ventanas"],0]]},
{t:"Mezclas, dilución y almacenamiento",ico:"🚫",min:6,src:"RD 374/2001; etiquetado y fichas de seguridad",obj:["No mezclar productos distintos salvo que el fabricante lo indique.","Diluir en la proporción correcta, en un lugar ventilado.","Almacenar envases cerrados, etiquetados y lejos de focos de calor."],b:[["1. No mezcles por tu cuenta",FIGI("assets/l18-almacen.webp","Armario de productos de limpieza con envases cerrados, etiquetados y separados, sobre una bandeja de retención","Mezclar lejía con un ácido o con amoníaco puede desprender un gas peligroso; cada producto se usa solo y como indica la etiqueta.")+"<p>Mezclar productos «para que limpien más» es una de las causas más graves de intoxicación en la limpieza. En particular, <b>nunca mezcles lejía con ácidos</b> (desincrustantes, algunos limpiadores de WC) <b>ni con amoníaco</b>: pueden desprender gases peligrosos.</p>"+UL(["Usa un solo producto para cada tarea, el indicado, y aclaremos bien si cambias de producto en la misma superficie.","Diluye solo como diga la etiqueta o el procedimiento: más concentrado no es más seguro ni siempre más eficaz.","Prepara las mezclas autorizadas en un lugar ventilado, con el EPI indicado, y no en un vaso o una botella de bebida.","No reutilices envases de alimentos o de otros productos."])],["2. Almacenaje",UL(["Mantén los envases <b>cerrados</b>, etiquetados y en el lugar asignado, fuera del paso y lejos de radiadores, lámparas y focos de ignición.","No dejes bayetas o mopas empapadas en producto inflamable junto a una fuente de calor.","No almacenes productos en habitaciones de clientes ni en un cubo descubierto.","Los inflamables, solo donde esté previsto.","Si hay un derrame, sigue el procedimiento (contener, ventilar, avisar); no lo dejes correr por el desagüe si la ficha lo prohíbe."])+CASO("«Un poco de lejía y el otro»","Un compañero te sugiere mezclar en el cubo la lejía con el desincrustante para dejar el baño más blanco.","No lo haces y explicas el riesgo. Cada producto se usa por separado, con aclarado si hace falta, y según su etiqueta.")]],key:"No mezcles productos distintos, en especial lejía con ácidos o amoníaco. Diluye solo como indique la etiqueta, en recipientes adecuados y ventilados. Almacena cerrado, etiquetado y lejos del calor.",q:[["Mezclar lejía con un desincrustante ácido o con amoníaco:",["Está prohibido: puede desprender un gas peligroso","Es un truco profesional recomendable","Solo es peligroso si se calienta","Da igual si se hace en el cubo grande"],0],["La dilución de un producto:",["Se hace en la proporción de la etiqueta o del procedimiento","Se hace «a ojo», cuanto más concentrado mejor","Se hace en una botella de agua, sin marcar","Se deja para que cada cual la invente"],0],["Los envases de producto se guardan:",["Cerrados, etiquetados y en el lugar asignado, lejos del calor","Abiertos, para no tener que destaparlos","En la mesilla de una habitación","Junto a un radiador, que así rinden más"],0],["Un derrame de producto en el office:",["Se contiene, se ventila y se avisa, siguiendo la ficha; no se improvisa el vertido al desagüe","Se empuja hacia el sumidero con el pie","Se cubre con papel y se deja","Se limpia con otro producto distinto, mezclándolos"],0]]}
]};
const M7={t:"Higiene y agentes biológicos",fmin:3,s:"Cómo trabajar con residuos y fluidos, la higiene de manos y qué hacer ante objetos punzantes o plagas.",L:[
