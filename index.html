{t:"Agentes biológicos y residuos",ico:"🧫",min:7,src:"RD 664/1997",obj:["Reconocer dónde puede haber un riesgo biológico en el puesto.","Manipular residuos y fluidos con protección, sin compactar las bolsas contra el cuerpo.","Actuar ante un pinchazo, una herida o un contacto accidental."],b:[["1. Dónde puede estar el riesgo",FIGI("assets/l19-biologico.webp","Trabajadora de limpieza con guantes retirando una bolsa de residuos del cubo de un baño, alejándola del cuerpo","En habitaciones y baños puede haber fluidos, residuos o materiales manchados: se tratan con higiene y protección, no con las manos desnudas.")+"<p>El puesto puede exponer a <b>agentes biológicos</b> por contacto o, a veces, por inhalación: fluidos, restos orgánicos, vómitos, excrementos, sangre, residuo de cubos o materiales manchados en habitaciones y baños. También hay riesgo si aparece un objeto punzante (una aguja, una cuchilla) entre la ropa o en un cubo.</p>"+UL(["Trabaja con los <b>guantes</b> indicados; en tareas con mayor riesgo (baños muy sucios, fluidos visibles) usa el EPI que te hayan asignado (guantes, y si procede delantal, mascarilla FFP2 u otro).","No compactes las bolsas de basura contra el cuerpo ni metas la mano en un cubo a ciegas.","No lances ni sacudas ropa muy sucia cerca de la cara.","Cubre cualquier herida con un apósito impermeable antes de empezar."])],["2. Pinchazos, heridas y contactos",ALERT("Ante un pinchazo, un corte o un contacto de piel no intacta o mucosas con un fluido: lava con agua y jabón (o lava el ojo con agua), no succionas, avisa de inmediato a la empresa y acude a la mutua o al dispositivo sanitario indicado. No lo dejes para «ver cómo evoluciona».")+UL(["Si aparece una aguja u otro objeto punzante, no lo recapsules ni lo dejes en el carro o en una papelera convencional. Protégelo y comunícalo para depositarlo en un contenedor rígido adecuado.","Cualquier herida, aunque parezca leve, se limpia y se cubre; reduce el riesgo de infección.","La vacunación que se ofrezca para el puesto (por ejemplo, tétanos u otras que indique el servicio médico) es una medida de salud laboral: te informarán de ventajas e inconvenientes y se recoge tu consentimiento. Lo médico lo valora el <b>médico del trabajo</b>."])],["3. Agua de consumo en centros ajenos","<p>No des por hecho que el agua de cualquier grifo de un centro ajeno es potable. Hasta que tu empresa o el establecimiento confirmen que es apta para beber, usa agua embotellada o el suministro que te indiquen, especialmente para evitar beber de un punto dudoso durante la jornada.</p>"]],key:"En baños, habitaciones y cubos puede haber riesgo biológico: usa el EPI, no compactes bolsas contra el cuerpo ni metas la mano a ciegas. Ante un pinchazo o un contacto con fluidos, lava, avisa y acude a valoración sanitaria. No asumas que cualquier grifo es potable.",q:[["Al retirar una bolsa de basura de un baño:",["La sacas con guantes, sin compactarla contra el cuerpo y sin meter la mano a ciegas","La aprietas contra el abdomen para que quepa más","Revolviste dentro con la mano desnuda","La sacudes a la altura de la cara"],0],["Si aparece una aguja entre la ropa o en un cubo:",["No la recapsulas ni la tiras a la papelera; la proteges y lo comunicas para el contenedor adecuado","La guardas en el bolsillo","La tiras al cubo de habitación, envuelta en papel","La rompes para que no pinche"],0],["Tras un pinchazo o un contacto de una mucosa con un fluido:",["Lavas, avisas de inmediato y acudes al dispositivo sanitario indicado","Esperas unos días a ver si pasa algo","Lo comentas solo si te encuentras mal","Te pones lejía en la herida y sigues"],0],["El agua de un grifo en un centro ajeno:",["No se da por potable hasta que te lo confirmen","Se bebe siempre, en todos los hoteles","Se usa para mezclar producto y también para beber","Solo es un riesgo en verano"],0],["Una herida en la mano, antes de empezar:",["Se cubre con un apósito impermeable","Se deja al aire, que así «cicatriza mejor»","Se tapa con una bayeta","Da igual, el guante basta aunque esté abierta y mojada"],0]]},
{t:"Higiene, ropa de trabajo y animales",ico:"🧼",min:6,src:"RD 664/1997; RD 773/1997",obj:["Aplicar la higiene de manos y no tocarse la cara con el guante.","Separar la ropa de trabajo de la de calle.","No manipular animales, insectos o plagas; comunicar."],b:[["1. Higiene de manos y hábitos",FIGI("assets/l20-higiene.webp","Trabajadora de limpieza lavándose las manos con agua y jabón en un office, con los guantes ya retirados","El lavado de manos y quitarse los guantes sin contaminarse cortan la cadena de contacto.")+"<p>Lávate las manos con agua y jabón al empezar y al terminar la jornada, al quitarte los guantes, después de una tarea sucia y siempre <b>antes de comer</b>. No te toques ojos, nariz o boca con el guante puesto. No comas, bebas, fumes ni masques chicle en la zona de trabajo.</p>"+UL(["Quítate los guantes hacia fuera, sin tocar el exterior con la piel, y tíralos o lávalos según te hayan indicado.","No salgas a la calle ni entres en un comedor con los guantes sucios o el delantal contaminado.","La ropa de trabajo y la de calle se guardan <b>por separado</b>. Sigue las instrucciones de tu empresa sobre el lavado y, si está previsto, la ducha al final de la jornada."])],["2. Insectos, animales y plagas","<p>En habitaciones, almacenes o zonas exteriores puedes encontrarte insectos, roedores o, en ocasiones, un animal de un cliente. No es tu trabajo atraparlos, golpearlos ni usar un plaguicida por tu cuenta.</p>"+UL(["No metas la mano en huecos, detrás de un mueble o en un cubo si sospechas que hay una plaga.","Cierra la puerta si procede, no agites nidos ni sprays improvisados, y comunícalo al centro y a tu responsable.","Si te pica o te muerde, lávate, avisa y acude a valoración sanitaria. No te automediques.","Las trabajadoras embarazadas o en lactancia pueden necesitar una adaptación ante ciertos agentes biológicos: lo valora el <b>médico del trabajo</b>."])+CASO("Una jeringuilla en el cubo","Al vaciar un cubo de habitación ves lo que parece una jeringuilla.","Paras, no metes la mano ni aprietas la bolsa, proteges la zona, avisas y esperas el contenedor y las indicaciones. No la lanzas a la basura general.")]],key:"Lávate las manos, no te toques la cara con el guante y separa la ropa de trabajo de la de calle. No manipules plagas ni objetos punzantes: comunica y sigue el procedimiento. Lo médico lo valora el médico del trabajo.",q:[["El lavado de manos es especialmente necesario:",["Al empezar y terminar, después de una tarea sucia y antes de comer","Solo los viernes","Solo si se ha usado lejía","Nunca, si has llevado guantes en algún momento del día"],0],["Con los guantes puestos no debes:",["Tocarte los ojos, la nariz o la boca","Sujetar el cubo","Cerrar una bolsa de residuo","Abrir una puerta del office de trabajo"],0],["La ropa de trabajo y la de calle:",["Se guardan por separado","Se mezclan en la misma bolsa, da igual","Se lleva la de trabajo a un restaurante, sin más","Se lava siempre en la habitación del cliente"],0],["Ante insectos, un roedor o un animal:",["No los manipulas ni usas un plaguicida por tu cuenta; lo comunicas","Los aplastas con el cubo","Compras un spray en el supermercado y lo aplicas","Los metes en una bolsa de ropa sucia"],0]]}
]};
const M8={t:"Ergonomía: posturas, repetición y cargas",fmin:3,s:"Cómo colocar el cuerpo, reducir la repetición, levantar cargas y manejar el carro de servicio.",L:[
{t:"Posturas de trabajo",ico:"🧍",min:6,src:"RD 486/1997; Guía técnica del INSST sobre posturas de trabajo",obj:["Evitar estar inclinada de forma prolongada.","Usar la escalera o el útil adecuado en vez de estirar el cuerpo.","Alternar la postura y comunicar molestias persistentes."],b:[["1. La espalda y las rodillas",FIGI("assets/l21-postura.webp","Trabajadora de limpieza flexionando las rodillas para limpiar una zona baja, con la espalda alineada","Agacharse desde las rodillas y acercar el cuerpo a la tarea reduce la carga de la espalda.")+"<p>El puesto implica muchas horas de pie, flexionarse para camas y zócalos, y alzar los brazos para cristales o baldas. Una postura forzada mantenida fatiga y puede acabar en una lesión.</p>"+UL(["Para zonas bajas, <b>flexiona las rodillas</b> y acerca el cuerpo; no trabajes largo rato con el tronco doblado.","Mantén la espalda alineada y evita encorvarte de forma continua.","Para zonas altas, usa la escalera de mano: no trabajes con los brazos por encima de los hombros durante rato, ni de puntillas.","Alterna el peso de un pie a otro, cambia de tarea cuando puedas y aprovecha micro-pausas para estirar con suavidad.","Si hay un medio auxiliar (mango telescópico, alza-colchón), úsalo."])+NOTE("Si aparece dolor, hormigueo o una molestia que no se pasa, comunícalo. La valoración médica corresponde al <b>médico del trabajo</b>; no esperes a que se haga crónica.")]],key:"Flexiona las rodillas para las zonas bajas, usa la escalera o un mango largo para las altas y no mantengas el tronco doblado ni los brazos alzados de forma prolongada. Alterna la postura y comunica las molestias persistentes.",q:[["Para limpiar un zócalo o debajo de la cama conviene:",["Flexionar las rodillas y acercar el cuerpo, no trabajar con el tronco doblado en exceso","Doblar solo la cintura y aguantar","Trabajar de puntillas, que llegas igual","Sentarte en los talones durante todo el pasillo"],0],["Para una zona alta (una baldilla, un cristal alto):",["Usas una escalera de mano o un mango adecuado, no estiras los brazos largo rato","Trabajas de puntillas con los brazos arriba todo el rato","Te subes a la cama","Pides que te alcen"],0],["Un dolor o un hormigueo que no se pasa:",["Se comunica; la valoración médica la hace el médico del trabajo","Se ignora hasta las vacaciones","Se trata con el producto de limpieza que «calienta»","Se comenta solo con los clientes"],0]]},
{t:"Movimientos repetitivos",ico:"🔁",min:5,src:"Guía técnica del INSST; Ley 31/1995, art. 15",obj:["Reconocer las tareas más repetitivas del puesto.","Repartir el esfuerzo y hacer micro-pausas.","Usar útiles en buen estado y con un mango adecuado."],b:[["1. Muñecas, brazos y hombros",FIGI("assets/l22-repetitivos.webp","Trabajadora de limpieza haciendo una cama acercando el cuerpo al colchón, sin estirar en exceso los brazos","Frotar, escurrir, hacer camas y limpiar cristales cargan muñecas y hombros si se hacen siempre igual y sin pausa.")+"<p>Frotar, escurrir, ordenar textiles, hacer camas y limpiar cristales son movimientos muy repetidos. La muñeca debe tender a una <b>posición neutra</b>, sin forzarla doblada o desviada de forma continua.</p>"+UL(["Acerca el cuerpo a la cama; no hagas la cama de lejos con los brazos tensos. Levanta el colchón lo mínimo imprescindible o usa el medio auxiliar si lo hay.","En cristales y paredes, mueve el brazo desde el hombro, no solo desde la muñeca.","Escurrir la fregona o la bayeta con técnica, sin retorcer con fuerza bruta.","Haz <b>micro-pausas</b> para relajar manos y antebrazos, y alterna tareas cuando la organización lo permita.","Usa útiles con mango en buen estado; un mango liso, corto o roto obliga a más fuerza y más repetición."])+CASO("Molestia en la muñeca","A media mañana notas un hormigueo en la muñeca después de un bloque de camas y cristales.","Haces una micro-pausa, relajas, evitas forzar y lo comunicas si sigue. No «aguantas como sea» hasta el final de la semana.")]],key:"Acerca el cuerpo a la tarea, mantén la muñeca lo más neutra posible, usa útiles adecuados y haz micro-pausas. Comunica el hormigueo o el dolor persistente.",q:[["En las tareas repetitivas de frotado o de camas conviene:",["Acercar el cuerpo, no forzar la muñeca y hacer micro-pausas","Hacer todas las camas del piso de un tirón, sin parar","Retorcer la fregona con la máxima fuerza, siempre igual","Trabajar solo con la muñeca, sin mover el hombro"],0],["Un mango roto o demasiado liso:",["Obliga a más fuerza y más repetición; se pide recambio","Da igual, «ya se conoce el oficio»","Se repara con cinta en cada habitación","Se usa solo la mano, sin mango"],0],["Si aparece hormigueo o dolor en la muñeca:",["Se comunica y no se deja alargar sin más","Se ignora, forma parte del trabajo","Se masajea con desengrasante","Se tapa con un guante más apretado"],0]]},
{t:"Cargas y sobreesfuerzos",ico:"📦",min:7,src:"RD 487/1997; Guía técnica del INSST sobre manipulación manual de cargas",obj:["Aplicar la técnica de levantamiento seguro.","Pedir ayuda o usar un medio auxiliar si la carga es incómoda o inestable.","No exceder lo que puedes manejar con seguridad."],b:[["1. Cómo levantar",FIGI("assets/l23-cargas.webp","Trabajadora de limpieza levantando un fardo de ropa cercano al cuerpo, con las rodillas flexionadas y la espalda alineada","Acercar la carga, flexionar las rodillas y no girar el tronco de golpe previene sobreesfuerzos.")+"<p>En el puesto se manejan fardos de ropa, packs de productos, bolsas de residuo y, a veces, mobiliario ligero (una mesilla, una silla, el borde de una cama). Aunque el peso sea inferior a 25 kg, una postura mala o un gesto brusco basta para un sobreesfuerzo.</p>"+UL(["Acércate a la carga, sepárala un poco del suelo y <b>flexiona las rodillas</b>, con la espalda alineada.","Sujeta con las dos manos, mantén el peso <b>cerca del cuerpo</b> y levanta con las piernas, no con un tirón de cintura.","No gires el tronco de golpe con la carga en peso: mueve los pies.","Evita levantar por encima de los hombros o por debajo de los tobillos de forma habitual.","Una carga inestable, muy voluminosa o que te tapa la vista es un riesgo aunque «no pese mucho»: pide ayuda o fracciona."])],["2. Pedir ayuda y límites","<p>No está reñido con el oficio pedir ayuda para un colchón, un bidón o un mueble. Si una trabajadora está embarazada o tiene una restricción que haya indicado el <b>médico del trabajo</b>, se adaptan las cargas.</p>"+CASO("Mover una cama","Para aspirar debajo te planteas arrastrar tú sola una cama pesada, en un ángulo raro, tirando de un extremo.","No lo fuerzas. Usas la técnica acordada, pides ayuda o mueves solo lo previsto con un medio auxiliar. Un tirón en torsión no «ahorra tiempo».")]],key:"Acerca la carga, flexiona las rodillas, mantenla cerca del cuerpo y no gires el tronco en peso. Fracciona, pide ayuda o usa un medio auxiliar si es incómoda o inestable.",q:[["La forma segura de levantar un fardo de ropa es:",["Acercarlo, flexionar las rodillas y subirlo cerca del cuerpo","Tirar de él con un golpe de cintura","Levantarlo de lado, con una sola mano, mientras cierras la puerta","Cargarlo por encima de la cabeza de un salto"],0],["Con la carga en peso, para cambiar de dirección:",["Mueves los pies; no giras el tronco de golpe","Giras la cintura lo más rápido posible","Lanzas el fardo y lo recoges","Apoyas la carga en una rodilla y te retuerces"],0],["Una carga incómoda o que te tapa la vista:",["Se fracciona o se pide ayuda, aunque «no pese tanto»","Se lleva igual, andando más deprisa","Se empuja con la cadera por las escaleras","Se lanza al carro desde lejos"],0],["Mover una cama o un mueble pesado en solitario con un tirón:",["No se fuerza; se pide ayuda o se usa el medio previsto","Es la técnica más profesional","Se hace si el cliente mira","Se hace siempre antes de las 12:00"],0]]},
{t:"Carros de servicio y mobiliario",ico:"🛒",min:5,src:"RD 1215/1997; RD 487/1997",obj:["Cargar y empujar el carro de forma estable.","No usarlo como escalera ni como freno improvisado.","Mover el mobiliario solo lo imprescindible y con técnica."],b:[["1. El carro es un equipo",FIGI("assets/l24-carros.webp","Carro de limpieza bien cargado, con lo pesado abajo, pasando por un pasillo despejado cerca de la pared","Un carro estable, sin sobrecargar la parte alta y guiado con control, evita empujones, vuelcos y golpes.")+"<p>El carro de servicio concentra peso, productos, ropa y residuo. Mal cargado o mal guiado, se vuelve una fuente de golpes, vuelcos y sobreesfuerzos.</p>"+UL(["Coloca lo pesado abajo y no sobrecargues la bandeja alta ni cuelgues bultos que desequilibren.","Empuja (mejor que tires) con las dos manos cuando puedas, mirando adelante, a un ritmo que te permita parar.","En rampas, desniveles y ascensores, controla el carro: no viajes con él si el procedimiento lo prohíbe, y no dejes que se escape.","No uses el carro como escalera, como banqueta ni como tope de una puerta.","Revisa ruedas y frenos; si falla una rueda, no lo fuerces y comunícalo.","Mueve mesillas o sillas solo lo necesario para limpiar, con la espalda alineada, y devuélvelas a su sitio sin arrastrar a tirones."])]],key:"Carga el carro con lo pesado abajo, empújalo con control y no lo uses como escalera. Revisa las ruedas y mueve el mobiliario solo lo imprescindible, sin tirones.",q:[["En el carro de servicio, lo más pesado debe ir:",["En la parte baja, sin sobrecargar la bandeja alta","Arriba, para tenerlo a la vista","Colgado de un lado, que ocupa menos","Encima de la bolsa de residuo, suelto"],0],["El carro no debe usarse como:",["Escalera, banqueta o tope de una puerta","Apoyo para los productos de la habitación","Medio para transportar la ropa","Sitio para la señal de suelo mojado, si cabe de forma estable"],0],["Si una rueda del carro falla:",["No lo fuerzas y lo comunicas","Sigues, inclinándolo hacia el otro lado","Lo arrastras a tirones por la escalera","Lo empujas más rápido, que así «pasa»"],0]]}
]};
const M9={t:"Organización del trabajo y riesgos psicosociales",fmin:3,s:"Fatiga y estrés, trato con clientes y violencia externa, y prevención del acoso.",L:[
{t:"Fatiga, estrés, organización y desgaste",ico:"🌙",min:6,src:"Ley 31/1995, arts. 15 y 26; Estatuto de los Trabajadores, arts. 34-38",obj:["Reconocer la fatiga y el estrés como riesgos del trabajo, no como un fallo personal.","Usar las pausas y comunicar una sobrecarga sostenida.","Saber a quién acudir si el desgaste se mantiene."],b:[["1. El ritmo también es un riesgo",FIGI("assets/l25-estres.webp","Dos trabajadoras de limpieza en un office, haciendo una pausa breve con agua, con el carro aparcado","Una organización clara, pausas y poder comunicar la carga evitan que la fatiga se convierta en un problema de salud.")+"<p>El puesto combina un ritmo a veces alto (salidas de habitaciones, picos de ocupación), trabajo en pie, desplazamientos y la exigencia de dejar cada espacio listo. La <b>fatiga</b>, el <b>estrés</b> y el <b>desgaste profesional</b> son riesgos laborales cuando se mantienen en el tiempo. No son «debilidad».</p>"+UL(["Planifica el recorrido cuando puedas: evita idas y venidas innecesarias y no corras con el carro.","Haz las <b>pausas</b> previstas, hidrátate y no sustituyas el descanso por «terminar antes a toda costa».","Si la asignación de habitaciones o el tiempo disponible es sistemáticamente inalcanzable, comunícalo a tu responsable: la organización del trabajo se puede ajustar.","Alterna tareas cuando sea posible y pide ayuda ante un pico puntual, no solo cuando ya estés agotada."])],["2. Qué hacer si te encuentras mal","<p>El insomnio, la irritabilidad, el cansancio que no se recupera o una bajada de rendimiento sostenida son señales. Comunícalo. La valoración de la salud corresponde al <b>médico del trabajo</b>; no es un asunto que deba resolverse en el pasillo ni con un producto «para aguantar».</p>"+NOTE("Las trabajadoras embarazadas o en periodo de lactancia pueden necesitar una adaptación de ritmos o de tareas. Se comunica a la empresa y lo valora el médico del trabajo.")]],key:"La fatiga, el estrés y el desgaste son riesgos del trabajo. Usa las pausas, no corras con el carro y comunica una carga sistemáticamente inalcanzable. La valoración de la salud la hace el médico del trabajo.",q:[["La fatiga y el estrés del puesto:",["Son riesgos laborales cuando se mantienen; se pueden comunicar y prevenir","Son un fallo de carácter de cada persona","Solo existen en oficinas","Se tratan trabajando más rápido"],0],["Si el número de habitaciones o el tiempo es sistemáticamente inalcanzable:",["Lo comunicas a tu responsable para que se valore la organización","Lo aguantas en silencio de forma indefinida","Compensas saltándote las pausas todos los días","Improvisas mezclando productos para ir más rápido"],0],["Las pausas previstas:",["Se respetan; hidratarse y parar forma parte de la prevención","Se saltan siempre, que queda mejor","Se usan para fregar otro pasillo","Solo existen en teoría"],0],["Una adaptación del puesto por embarazo o por un problema de salud la valora:",["El médico del trabajo","El cliente del hotel","Un compañero","Tú, sin decírselo a nadie"],0]]},
{t:"Trato con clientes y violencia externa",ico:"🗣️",min:5,src:"Ley 31/1995; protocolos de la empresa",obj:["Mantener una distancia segura y no entrar en un conflicto.","Saber qué hacer ante una agresión, una amenaza o una situación incómoda.","Comunicar el incidente; no es un asunto privado."],b:[["1. Cuando alguien se enfada o te intimida",FIGI("assets/l26-violencia.webp","Trabajadora de limpieza en un pasillo manteniendo distancia educada con un huésped, con la puerta de la habitación abierta","Ante un tono agresivo, lo primero es no quedar encerrada, no responder al mismo nivel y pedir ayuda.")+"<p>En habitaciones y pasillos puedes encontrarte con un cliente o un usuario enfadado, bajo los efectos del alcohol, que no quiere que entres o que te falta al respeto. La <b>violencia externa</b> (insultos, amenazas, agresión, un comportamiento sexualmente inapropiado) es un riesgo laboral.</p>"+UL(["Llama a la puerta, anúnciate y no insistas si te piden que no entres o si la situación te resulta insegura.","Mantén una <b>vía de salida</b>: no te quedes entre la persona y la puerta.","Habla con calma, sin discutir el conflicto. No respondas a un insulto con otro.","Si la situación escala, <b>sal, pide ayuda</b> al centro y a tu responsable, y no intentes inmovilizar ni «poner en su sitio» a nadie.","Comunica cualquier incidente, aunque no haya habido contacto físico: permite que la empresa y el centro tomen medidas."])+CASO("Un tono agresivo en la habitación","Al entrar a limpiar, la persona que ocupa la habitación te grita y se acerca de forma amenazante.","No discutes. Sales, dejas la puerta según el procedimiento, pides apoyo y lo comunicas. No vuelves sola a esa habitación hasta que te lo indiquen.")]],key:"Ante un conflicto, mantén la calma y una vía de salida, no discutas y pide ayuda. Comunica amenazas, insultos o agresiones: son un riesgo laboral, no un asunto privado.",q:[["Si un cliente se muestra agresivo al entrar a una habitación:",["Sales, pides ayuda y lo comunicas; no te quedas a discutir","Le contestas al mismo nivel","Cierras la puerta para «hablarlo en privado»","Sigues limpiando como si no pasara nada"],0],["La violencia verbal (insultos, amenazas) en el trabajo:",["Es un riesgo laboral y se comunica","Solo cuenta si hay un golpe","Es parte del trato con el público y no se informa","Se resuelve únicamente al final de la temporada"],0],["Al entrar en una habitación ocupada conviene:",["Llamar, anunciarte y no quedar sin una vía de salida","Entrar en silencio y cerrar con llave","Discutir si te recrimina algo del servicio","Insistir aunque te pidan que no entres y te sientas insegura"],0],["Un comportamiento sexualmente inapropiado de un usuario:",["Se interrumpe la situación, te pones a salvo y lo comunicas","Se ignora siempre, para no «montar un lío»","Se responde con una broma y se sigue","Solo se cuenta si hay testigos clientes"],0]]},
{t:"Acoso laboral, sexual o por razón de sexo",ico:"📣",min:6,src:"Ley 31/1995; Ley Orgánica 3/2007; Ley Orgánica 10/2022",obj:["Reconocer qué es el acoso y que no se debe tolerar.","Saber que existe un canal para comunicarlo.","Distinguir el acoso de un conflicto puntual, y pedir ayuda."],b:[["1. Tolerancia cero",FIGI("assets/l27-acoso.webp","Trabajadora de limpieza en un espacio reservado, informándose del canal de comunicación de la empresa","El acoso no forma parte del trabajo. Hay canales para comunicarlo y la empresa debe prevenirlo y actuar.")+"<p>El <b>acoso laboral</b>, el <b>acoso sexual</b> y el <b>acoso por razón de sexo</b> están prohibidos. No son «cosas que pasan» ni una broma más. Pueden provenir de un mando, de un compañero o de un cliente o usuario.</p>"+UL(["El acoso laboral es una conducta reiterada de hostigamiento, aislamiento o humillación que atenta contra la dignidad.","El acoso sexual incluye conductas de naturaleza sexual no deseadas (comentarios, tocamientos, insinuaciones, envío de imágenes, chantaje).","El acoso por razón de sexo se dirige a una persona por su sexo o su identidad, o por no atenerse a un estereotipo."])+LEY("La empresa debe promover condiciones que eviten el acoso y arbitrar procedimientos específicos para su prevención y para dar cauce a las denuncias o reclamaciones (Ley Orgánica 3/2007 y normativa de desarrollo). El acoso sexual y por razón de sexo también se aborda en la Ley Orgánica 10/2022.")],["2. Cómo se comunica",UL(["Usa el <b>canal o protocolo de tu empresa</b> (persona de referencia, buzón, delegados de prevención o el cauce que os hayan informado). También puedes acudir a la autoridad laboral o a los tribunales.","Guarda, si puedes, mensajes o fechas que ayuden a explicar los hechos.","Quien comunica un acoso no debe sufrir represalias por hacerlo.","Si estás en una situación de urgencia o de violencia, ponerte a salvo y pedir ayuda inmediata es lo primero."])+NOTE("Este curso te informa del derecho y de la obligación de la empresa de tener un procedimiento. El contenido concreto del protocolo es el de tu empresa: pídelo si no te lo han entregado.")]],key:"El acoso laboral, sexual o por razón de sexo está prohibido y no forma parte del trabajo. Comunícalo por el canal de tu empresa o por las vías legales; no debe haber represalias. En una situación de urgencia, ponte a salvo y pide ayuda.",q:[["El acoso sexual o por razón de sexo en el trabajo:",["Está prohibido y la empresa debe tener un procedimiento para prevenirlo y atenderlo","Solo es acoso si lo hace un desconocido en la calle","Se debe aguantar si viene de un cliente","Es un asunto exclusivamente privado"],0],["Una conducta de acoso se puede comunicar:",["Por el canal o protocolo de la empresa, y también ante las autoridades","Únicamente al propio agresor, en privado","Solo si todo el equipo está de acuerdo","Nunca, porque no se puede hacer nada"],0],["Quien comunica un acoso:",["No debe sufrir represalias por hacerlo","Pierde automáticamente el puesto","Debe pedirle perdón al presunto acosador","Solo puede hablar después de un año"],0],["En una situación de urgencia o de violencia:",["Lo primero es ponerte a salvo y pedir ayuda inmediata","Quedarte a recoger pruebas aunque el riesgo siga","Discutir el protocolo en ese momento","Cerrar la puerta y esperar a que se le pase"],0]]}
]};
const M10={t:"Desplazamientos entre centros",fmin:3,s:"Conducción segura, el trayecto al centro y cómo llegar, aparcar y descargar el material.",L:[
{t:"Desplazamientos y accidente de tráfico",ico:"🚗",min:7,src:"RD Legislativo 6/2015 (Ley de Tráfico); Ley 31/1995",obj:["Revisar el vehículo y respetar las normas de tráfico.","No conducir bajo los efectos del alcohol, drogas o medicamentos que alteren la atención.","Bajar y cargar con seguridad, también en el trayecto al centro."],b:[["1. El trayecto también cuenta",FIGI("assets/l28-trafico.webp","Persona del personal de limpieza junto a un turismo o furgoneta, con el cinturón y el material bien colocado antes de salir","Muchos desplazamientos al centro o entre centros se hacen en vehículo: el trayecto forma parte de la jornada de riesgo.")+"<p>El puesto puede ser itinerante: te desplazas a un centro, o entre varios, en vehículo propio, de empresa o en transporte público. El <b>accidente de tráfico</b> (in itinere o durante la jornada) es un riesgo real.</p>"+UL(["Si conduces, el vehículo debe estar en <b>condiciones seguras</b>: frenos, luces, intermitentes, neumáticos, niveles y limpiaparabrisas. Cualquier anomalía se comunica y se resuelve antes de usarlo.","Respeta las normas de tráfico, adapta la velocidad a la vía y al tiempo, y usa siempre el <b>cinturón</b>.","Está prohibido conducir bajo los efectos del alcohol, drogas o medicamentos que alteren la atención o los reflejos. Si un medicamento te lo indica, no conduzcas y consúltalo con el profesional sanitario.","El teléfono, solo con un sistema de <b>manos libres</b> autorizado; no manipules el móvil con el vehículo en marcha.","Lleva un permiso de conducción adecuado al vehículo."])],["2. Parar, cargar y bajar",UL(["No te detengas junto a un desnivel ni en un punto ciego. Al bajar en carretera, usa el chaleco si está indicado y baja por el lado seguro.","Coloca el material de forma que no se desplace ni te tape la visión; no sobrecargues el vehículo.","Planifica el tiempo: salir justa favorece el exceso de velocidad.","Si vas en transporte público o a pie, usa itinerarios seguros, calzado adecuado y precaución en pasos y aparcamientos."])+CASO("Un retraso a primera hora","Sales justo de tiempo y te plantea «recuperar» minutos saltándote un límite o mirando el móvil en un semáforo.","No lo haces. Es preferible comunicar un retraso que asumir un accidente. El trayecto no se improvisa.")]],key:"Revisa el vehículo, respeta las normas, usa el cinturón y no conduzcas bajo los efectos de alcohol, drogas o medicamentos que alteren la atención. El móvil, solo con manos libres. Planifica el tiempo y carga el material de forma segura.",q:[["Antes de conducir hacia el centro debes:",["Comprobar que el vehículo está en condiciones y no usarlo si hay una anomalía grave","Salir aunque los frenos «vayan un poco justos»","Desconectar las luces para ahorrar","Dejar el cinturón «solo en carretera»"],0],["El uso del cinturón:",["Es obligatorio para todos los ocupantes en los vehículos que lo tienen","Es opcional si el trayecto es corto","Solo obliga al acompañante","No aplica a furgonetas de trabajo"],0],["Conducir después de beber alcohol o con un medicamento que altera la atención:",["Está prohibido","Vale si es «poca cantidad»","Vale de vuelta, no de ida","Vale si conoces bien el camino"],0],["El teléfono móvil durante la conducción:",["Solo con un sistema de manos libres autorizado","Se puede mirar en los semáforos, sin problema","Se sujeta entre el hombro y la oreja","Se deja en el salpicadero, con vídeo"],0],["Si vas justa de tiempo:",["No compensas corriendo; es preferible comunicar un retraso","Te saltas un límite «solo hoy»","Adelantas por cualquier sitio","Lees el WhatsApp en marcha para avisar"],0]]},
{t:"Llegada, aparcamiento y carga del material",ico:"🅿️",min:5,src:"RD 486/1997; RD 171/2004",obj:["Aparcar y bajar el material sin exponerse al tráfico del recinto.","No bloquear salidas ni muelles.","Pedir ayuda o un medio auxiliar si la carga de entrada es excesiva."],b:[["1. El recinto también tiene tráfico",FIGI("assets/l29-carga.webp","Trabajadora de limpieza bajando material de un vehículo en una zona segura, fuera del paso de otros coches","En muelles, reseñas y aparcamientos hay marchas atrás y prisas: bajar el material con calma es parte de la prevención.")+"<p>Al llegar a un hotel, una oficina o una zona de servicio puedes cruzarte con furgonetas, contenedores, muelles y marchas atrás. El riesgo no termina al aparcar.</p>"+UL(["Aparca en el lugar indicado, sin bloquear salidas, pasos de peatones, hidrantes ni muelles.","Baja del vehículo mirando; no abras la puerta a un paso de coches.","Saca el material por el lado seguro, sin cruzar una rampa a ciegas y sin sobrecargarte de un solo viaje.","Usa el carro o pide ayuda para bidones, fardos o una entrada con escalones.","Respeta las normas del recinto y las zonas de carga; no improvises un atajo por un muelle en uso."])+NOTE("En un centro ajeno, las normas de circulación interior las marca el titular. Si no están claras, pregunta antes de entrar con el vehículo o con una carga voluminosa.")]],key:"Aparca donde esté indicado, baja el material por un lado seguro y no sobrecargues ni bloquees salidas. En el recinto hay tráfico interno: pregunta las normas si no las conoces.",q:[["Al llegar al centro, el vehículo se deja:",["En el lugar indicado, sin bloquear salidas ni muelles","En doble fila, un momento, junto a la puerta principal","Delante de un hidrante, si es poco rato","En el paso de peatones, «que se ve mejor»"],0],["Para bajar bidones o fardos del maletero:",["Se fracciona la carga o se usa un carro; no se saca todo de un tirón","Se cruza el muelle a ciegas, lo más rápido posible","Se lanza al suelo y se recoge","Se pide a un desconocido que lo lleve, sin más"],0],["Si no conoces las normas de circulación del recinto:",["Preguntas antes de entrar con el vehículo o con una carga voluminosa","Entras por donde veas un hueco","Usas el sentido contrario, que está más vacío","Aparcas en la rampa de ambulancias, un momento"],0]]}
]};
const M11={t:"Protección personal, salud y emergencias",fmin:3,s:"EPI del puesto, vigilancia de la salud, incendio y evacuación, y primeros auxilios.",L:[
{t:"Equipos de protección individual",ico:"🧤",min:6,src:"RD 773/1997; UNE-EN ISO 20347; UNE-EN 166; UNE-EN 374",obj:["Saber qué EPI corresponde al puesto y que es la última barrera.","Usarlo, cuidarlo y pedir recambio si está deteriorado.","No sustituirlo por un objeto improvisado."],b:[["1. Qué te protege en este puesto",FIGI("assets/l30-epi.webp","Equipos de protección de limpieza ordenados: calzado, guantes, gafas y mascarilla, junto a un carro","El EPI no sustituye al orden ni a un producto más seguro: es la última barrera, y hay que usarlo bien.")+"<p>El EPI es cualquier equipo destinado a ser llevado o sujetado por ti para que te proteja de uno o varios riesgos. En este puesto, según la tarea y la ficha del producto, suelen corresponder:</p>"+UL(["<b>Calzado de trabajo antideslizante</b> (por ejemplo UNE-EN ISO 20347), de uso habitual.","<b>Guantes</b> adecuados al riesgo: químico según la ficha (a menudo UNE-EN 374) y, si procede, de nitrilo u otro material indicado; no todos los guantes valen para todos los productos.","<b>Gafas de protección de riesgo químico</b> (UNE-EN 166) cuando hay salpicadura.","<b>Mascarilla o máscara con el filtro indicado</b> (por ejemplo FFP2 u otro según la ficha) cuando hay inhalación o polvo.","En tareas con riesgo biológico elevado, la <b>ropa o el delantal de protección</b> que te hayan asignado."])+"<p>El EPI es la <b>última barrera</b>: primero se intenta eliminar o reducir el riesgo de otro modo. Pero cuando está indicado, <b>es obligatorio usarlo</b> y usarlo bien.</p>"],["2. Uso y mantenimiento",UL(["Te lo debe facilitar la empresa, sin coste, y formarte en su uso.","Revístelo antes de usarlo: no uses un guante roto, una gafa rayada que no selle o un calzado con la suela lisa.","Pide recambio; no lo sustituyas por una bolsa de plástico, unas gafas de sol o una zapatilla de calle.","Guárdalo limpio y seco, separado de los productos y de la ropa de calle cuando proceda.","El EPI es personal: no compartas guantes o mascarillas de un solo uso."])]],key:"El EPI de este puesto incluye, según la tarea, calzado antideslizante, guantes, gafas, mascarilla y, si procede, ropa de protección. Es la última barrera, de uso obligatorio cuando está indicado, y se pide recambio si está deteriorado.",q:[["El EPI es:",["La última barrera, de uso obligatorio cuando está indicado","Un adorno del uniforme","Voluntario si tienes prisa","Sustituto de todas las demás medidas"],0],["El calzado de trabajo de la limpieza debe ser, de forma habitual:",["Antideslizante, cerrado y en buen estado","Una chancla, que se lava mejor","El de calle, si es cómodo","Opcional en interiores"],0],["Unos guantes se eligen:",["Según el riesgo y la ficha del producto, no «cualquiera»","Por el color de la habitación","El más fino siempre","Da igual, todos son iguales"],0],["Si un EPI está roto o la suela lisa:",["Pides recambio y no lo usas en ese estado","Lo sigues usando hasta que se acabe del todo","Lo reparas con cinta y producto químico","Se lo pides prestado a un compañero, aunque sea de un solo uso"],0]]},
{t:"Vigilancia de la salud y especial sensibilidad",ico:"🩺",min:5,src:"Ley 31/1995, arts. 22, 25 y 26",obj:["Entender que la vigilancia de la salud es, por norma general, voluntaria y confidencial.","Saber que las decisiones médicas las toma el médico del trabajo.","Comunicar una situación de especial sensibilidad, embarazo o lactancia."],b:[["1. Reconocimientos médicos",FIGI("assets/l31-salud.webp","Consulta de vigilancia de la salud, con una profesional sanitaria y una trabajadora en un despacho reservado","La empresa ofrece la vigilancia de la salud; los resultados clínicos son confidenciales y la aptitud es lo único que recibe la empresa.")+"<p>La empresa debe ofrecer una <b>vigilancia de la salud</b> periódica, adecuada al puesto (art. 22 LPRL). Por norma general es <b>voluntaria</b>: tú decides si te la haces, salvo los casos en que una norma la hace preceptiva. Los resultados clínicos son <b>confidenciales</b>: el personal sanitario no los comunica a la empresa. A la empresa solo le consta tu <b>aptitud</b> (o las limitaciones) para el puesto.</p>"+UL(["Lo que sea un juicio médico (un síntoma, una prueba, una vacunación, una aptitud) lo valora el <b>médico del trabajo</b>, no tu encargado ni este curso.","Si aparece una molestia que pueda relacionarse con el trabajo (piel, respiración, espalda, una reacción a un producto), comunícalo y acude al cauce sanitario indicado."])],["2. Especial sensibilidad, embarazo y lactancia","<p>Si eres especialmente sensible a un riesgo, o estás embarazada o en periodo de lactancia, la empresa debe adaptar el puesto o, si no es posible, aplicar las medidas previstas en los artículos 25 y 26 LPRL. Para eso necesita que se lo comuniques, y la valoración es médica.</p>"+NOTE("En este curso no se dan indicaciones clínicas ni se sustituye al médico del trabajo. Si tienes dudas sobre un producto, una vacuna o una restricción, consúltalo con el servicio de vigilancia de la salud.")]],key:"La vigilancia de la salud es, por norma general, voluntaria y confidencial; la empresa solo conoce la aptitud. El médico del trabajo valora lo clínico y las adaptaciones por sensibilidad, embarazo o lactancia.",q:[["La vigilancia de la salud es, por norma general:",["Voluntaria y confidencial; la empresa solo conoce la aptitud","Obligatoria siempre y pública para la plantilla","Un trámite que firma el encargado, sin médico","Un análisis cuyos resultados se cuelgan en el tablón"],0],["Las decisiones médicas de tu aptitud o de una adaptación las toma:",["El médico del trabajo","Tu encargado, según lo que le cuentes en el pasillo","El cliente del centro","Este curso, con un test"],0],["Si estás embarazada o eres especialmente sensible a un riesgo:",["Lo comunicas a la empresa para que se valore y se adapte el puesto si procede","Dejas de venir sin decir nada y ya está","Lo decides tú sola, cambiando productos por tu cuenta","Se lo dices solo a un cliente, no a la empresa"],0],["Un resultado clínico del reconocimiento:",["Es confidencial y no se comunica a la empresa","Lo recibe tu responsable de equipo por correo","Se comenta en la reunión de plantilla","Lo puede pedir cualquier compañero"],0]]},
{t:"Emergencias e incendio",ico:"🚨",min:7,src:"Ley 31/1995, art. 20; RD 393/2007",obj:["Conocer, en cada centro, alarmas, salidas y punto de reunión.","Prevenir el incendio en la limpieza.","Actuar: avisar, extinguir solo un conato si sabes y no hay riesgo, y evacuar sin usar el ascensor."],b:[["1. Conocer el plan de cada centro",FIGI("assets/l32-incendio.webp","Pasillo de hotel con señal de salida de emergencia visible y un extintor accesible, sin obstáculos","En un trabajo itinerante, las salidas, los extintores y el punto de reunión cambian de un centro a otro: localízalos al llegar.")+"<p>La empresa debe analizar las posibles emergencias y adoptar las medidas necesarias (art. 20 LPRL), incluida la formación. En un centro ajeno, tú debes <b>conocer las instrucciones de ese establecimiento</b>.</p>"+UL(["Al llegar, localiza <b>salidas, pulsadores, extintores y el punto de reunión</b>. No bloquees nunca una salida ni un extintor con el carro.","No acumules papel, textiles ni envases junto a enchufes o fuentes de calor. Los inflamables, solo donde esté previsto, cerrados.","Prohibido fumar en las zonas de trabajo. No dejes mopas o paños empapados en producto junto a un radiador o una lámpara.","Ante chispazos, olor a quemado o un enchufe caliente: desconecta si es seguro y avisa."])],["2. Si hay humo o fuego",OL(["Mantén la calma y <b>avisa</b> (personal del centro, alarma, 112 si procede).","Si es un conato, has recibido formación, tienes el extintor adecuado y <b>no pones en riesgo tu integridad</b>, puedes intentar sofocarlo. Si no se controla en segundos, no sigas.","Evacua por la ruta prevista, <b>sin usar ascensores</b>, y no vuelvas a entrar a por el carro o una pertenencia.","Espera en el punto de reunión hasta que te lo indiquen.","Cualquier conato, aunque se apague, se comunica."])+ALERT("Tu seguridad está por delante de una habitación o de un carro. No improvises un héroe si el fuego o el humo superan un conato.")+CASO("Olor a quemado en un office","Al entrar notas olor a quemado y un poco de humo junto a un enchufe múltiple.","Desconectas si puedes sin riesgo, sales, das la alarma y avisas. No echas agua a un cuadro eléctrico ni te entretienes a recoger productos.")]],key:"En cada centro, localiza salidas, extintores y el punto de reunión, y no los bloquees. Previene el incendio (orden, inflamables, no fumar, no sobrecargar tomas). Ante fuego o humo: avisa, evacua sin ascensor y no te expongas.",q:[["Al llegar a un centro debes localizar:",["Salidas de emergencia, extintores, cómo dar la alarma y el punto de reunión","Solo el office de café","Únicamente el aparcamiento","La habitación más lejana, nada más"],0],["El carro o una pila de ropa:",["No deben bloquear una salida ni un extintor","Se pueden dejar en una salida «un momento»","Van mejor delante de un pulsador","Da igual, en un incendio no se usan las señales"],0],["Si hay un fuego que no se controla en segundos:",["Activas la alarma, evacuas sin usar el ascensor y no vuelves a entrar","Bajas por el ascensor, que es más rápido","Vuelves a por el carro y el móvil","Echas agua a un cuadro eléctrico"],0],["Un conato que has conseguido apagar:",["También se comunica","No se dice, para no asustar","Se deja el extintor tirado y nada más","Solo se informa si ha habido heridos"],0],["Está prohibido, para prevenir un incendio:",["Fumar en las zonas de trabajo y dejar textiles empapados en producto junto a un radiador","Usar calzado antideslizante","Señalizar un suelo mojado","Lavar las manos"],0]]},
{t:"Primeros auxilios: proteger, avisar y socorrer",ico:"⛑️",min:6,src:"Ley 31/1995, art. 20; recomendaciones del Consejo Español de Resucitación",obj:["Aplicar la conducta PAS: proteger, avisar, socorrer.","Saber cómo pedir ayuda al 112.","No improvisar maniobras que no conoces; el botiquín es para lo básico."],b:[["1. Proteger, avisar, socorrer",FIGI("assets/l33-auxilios.webp","Trabajadora de limpieza avisando por teléfono en un pasillo, junto a un compañero sentado, sin aglomerar la zona","Lo primero es que no haya un segundo accidente: protege, avisa al 112 si hace falta y socorre según tu formación.")+"<p>Ante un accidente, la conducta es <b>PAS</b>: <b>Proteger</b> (la zona y a ti, para que no haya un segundo daño), <b>Avisar</b> y <b>Socorrer</b> con lo que sepas, sin improvisar una técnica que no has aprendido.</p>"+UL(["No muevas a una persona con un traumatismo importante salvo peligro inminente (incendio, atropello).","Pide ayuda al centro y, si la situación lo requiere, llama al <b>112</b>: indica el lugar exacto, qué ha pasado, cuántas personas y el estado aparente. No cuelgues hasta que te lo digan.","El centro debe disponer de un <b>botiquín</b> accesible y señalizado, para la atención inmediata de pequeñas lesiones. Úsalo para eso, no como armario de medicamentos personales.","Ante una hemorragia visible, puedes aplicar una presión directa con un paño limpio si sabes cómo y no hay un objeto clavado que no debas retirar.","Si no respiras y has sido formado, inicia la reanimación que te hayan enseñado y pide un desfibrilador si hay uno."])],["2. Lo que no se improvisa","<p>No des medicamentos, no «endereces» un miembro y no apliques productos de limpieza a una herida o una quemadura. La valoración clínica no es tuya ni de un compañero: es del personal sanitario. Comunica el accidente a la empresa, aunque parezca leve.</p>"+CASO("Un resbalón con golpe en la cabeza","Una compañera resbala en un rellano y se golpea la cabeza; está desorientada.","Proteges la zona (señalizas el suelo, detienes el paso), avisas y no la haces levantar de golpe ni la dejas sola. Llamas al 112 si no se recupera con claridad o se lo indican.")]],key:"Ante un accidente: protege, avisa (112 si procede) y socorre solo con lo que sabes. No muevas a un herido grave sin peligro inminente, no des medicamentos ni uses productos de limpieza como remedio. Comunica el accidente.",q:[["La conducta PAS significa:",["Proteger, avisar y socorrer","Correr, grabar y opinar","Empujar, acelerar y salir","Pensar, esperar y marcharse"],0],["Al llamar al 112 conviene indicar:",["El lugar exacto, qué ha pasado, cuántas personas y el estado aparente","Solo el nombre del hotel, sin más datos","Colgar en cuanto contesten","Pedir que no vengan si ya hay un botiquín"],0],["A una persona que se ha golpeado la cabeza y está desorientada:",["No la haces levantar de golpe ni la dejas sola; proteges, avisas y esperas indicación sanitaria","Le das un producto de limpieza «para el mareo»","La subes al ascensor para que se tome el aire en la azotea","La dejas y sigues el pasillo, a ver si se le pasa"],0],["El botiquín del centro:",["Es para la atención inmediata de pequeñas lesiones, y debe estar accesible y señalizado","Es el botiquín personal de cada trabajador","Se guarda bajo llave en un coche particular","Se usa como almacén de productos de limpieza"],0]]}
]};
